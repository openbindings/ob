            type: object
        NewInterfaceInput:
            additionalProperties: false
            properties:
                description:
                    type: string
                name:
                    type: string
                openbindings:
                    description: Target OpenBindings spec version; defaults to the tool's max tested version.
                    type: string
                version:
                    type: string
            type: object
        OpenBindingsInterface:
            additionalProperties: true
            description: A valid OpenBindings interface document.
            type: object
        Operation:
            additionalProperties: true
            description: An operation definition as it would appear in an interface.
            properties:
                deprecated:
                    type: boolean
                description:
                    type: string
                input: {}
                output: {}
                tags:
                    items:
                        type: string
                    type: array
            type: object
        OperationAliasEntry:
            additionalProperties: false
            description: An operation and the interface operations it corresponds to via aliases.
            properties:
                aliases:
                    items:
                        type: string
                    type: array
