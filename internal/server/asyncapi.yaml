asyncapi: 3.0.0
info:
    description: Cardinality-agnostic binding and operation invocation over WebSocket frame streams.
    title: ob start invocation API
    version: 0.1.0
servers:
    local:
        host: ${OB_SERVER_HOST}
        protocol: ${OB_SERVER_PROTOCOL}
        security:
            - $ref: '#/components/securitySchemes/bearer'
            - $ref: '#/components/securitySchemes/tokenQuery'
channels:
    bindingsInvoke:
        address: /bindings/invoke
        bindings:
            ws:
                method: GET
        messages:
            inputFrame:
                $ref: '#/components/messages/invokeBindingInputFrame'
            outputFrame:
                $ref: '#/components/messages/invokeBindingOutputFrame'
    operationsInvoke:
        address: /operations/invoke
        bindings:
            ws:
                method: GET
        messages:
            inputFrame:
                $ref: '#/components/messages/invokeOperationInputFrame'
            outputFrame:
                $ref: '#/components/messages/invokeOperationOutputFrame'
operations:
    invokeBinding:
        action: receive
        channel:
            $ref: '#/channels/bindingsInvoke'
        description: Invoke a resolved binding via a typed bidirectional I/O frame stream (the binding-invoker frame protocol). The caller streams BindingInvokerInputFrame messages (one `open` carrying the BindingInvocationInput, zero or more `input`, one `close`); the service streams BindingInvokerOutputFrame messages back (zero or more `output`/`input_closed`, then exactly one terminal `complete` or `error`). One shape covers unary, server-streaming, client-streaming, and bidirectional bindings; cardinality is observed by how the caller drives the frames. Missing runtime context fails with a terminal CONTEXT_REQUIRED error carrying ContextRequiredDetails, before any output and any side effect.
        messages:
            - $ref: '#/channels/bindingsInvoke/messages/inputFrame'
        reply:
            channel:
                $ref: '#/channels/bindingsInvoke'
            messages:
                - $ref: '#/channels/bindingsInvoke/messages/outputFrame'
        summary: Invoke a resolved binding via a typed bidirectional I/O frame stream (the binding-invoker frame protocol).
    invokeOperation:
        action: receive
        channel:
            $ref: '#/channels/operationsInvoke'
        description: 'Invoke an operation on an interface via a typed bidirectional I/O frame stream (the operation-invoker frame protocol). Unlike invokeBinding, the caller names an operation (or a specific binding) on a supplied interface, and the invoker resolves the name, selects a binding, validates against the operation''s schemas, applies its transforms, and drives the underlying binding invoker. The frame shape mirrors invokeBinding exactly: one `open` carrying the OperationInvocationInput, then input frames and a close; output frames plus a terminal complete or error. Cardinality is observed, not declared, so a request/response and a streaming binding can satisfy the same operation identically. Missing context fails with a terminal CONTEXT_REQUIRED error before any side effect.'
        messages:
            - $ref: '#/channels/operationsInvoke/messages/inputFrame'
        reply:
            channel:
                $ref: '#/channels/operationsInvoke'
            messages:
                - $ref: '#/channels/operationsInvoke/messages/outputFrame'
        summary: Invoke an operation on an interface via a typed bidirectional I/O frame stream (the operation-invoker frame protocol).
components:
    messages:
        invokeBindingInputFrame:
            name: invokeBindingInputFrame
            payload:
                $ref: '#/components/schemas/BindingInvokerInputFrame'
        invokeBindingOutputFrame:
            name: invokeBindingOutputFrame
            payload:
                $ref: '#/components/schemas/BindingInvokerOutputFrame'
        invokeOperationInputFrame:
            name: invokeOperationInputFrame
            payload:
                $ref: '#/components/schemas/OperationInvokerInputFrame'
        invokeOperationOutputFrame:
            name: invokeOperationOutputFrame
            payload:
                $ref: '#/components/schemas/OperationInvokerOutputFrame'
    schemas:
        AddOperationAliasInput:
            additionalProperties: false
            properties:
                aliases:
                    description: Satisfaction alias(es) to add.
                    items:
                        type: string
                    minItems: 1
                    type: array
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any existing identifier.
                    type: string
            required:
                - interface
                - operation
                - aliases
            type: object
        AddOperationInput:
            additionalProperties: false
            properties:
                aliases:
                    description: Satisfaction aliases — other interfaces' operation keys this operation also answers to (OBI-T-12).
                    items:
                        type: string
                    type: array
                description:
                    type: string
                idempotent:
                    description: Whether the new operation is idempotent.
                    type: boolean
                input:
                    description: JSON Schema for the new operation's input.
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                key:
                    description: Key for the new operation.
                    type: string
                output:
                    description: JSON Schema for the new operation's output.
                tags:
                    items:
                        type: string
                    type: array
            required:
                - interface
                - key
            type: object
        AddSourceInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                source:
                    $ref: '#/components/schemas/SynthesizeInterfaceSource'
            required:
                - interface
                - source
            type: object
        BindOperationInput:
            additionalProperties: false
            properties:
                force:
                    description: Overwrite an existing binding for this operation and source.
                    type: boolean
                inputTransform:
                    description: Inline JSONata transforming operation input to binding input.
                    type: string
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any identifier.
                    type: string
                outputTransform:
                    description: Inline JSONata transforming binding output to operation output.
                    type: string
                preference:
                    description: Author preference signal (higher = more preferred); this field does not itself select a binding.
                    type: number
                ref:
                    description: Source ref (wire identifier) to bind.
                    type: string
                source:
                    description: Registered source key.
                    type: string
                transformStub:
                    description: Scaffold identity transform stub(s) on shape mismatch.
                    type: boolean
            required:
                - interface
                - operation
                - source
                - ref
            type: object
        BindableTarget:
            description: A target admitted by the source's governing binding specification that can be framed as an OpenBindings operation. Any included framing is a sound projection of this same target.
            properties:
                operation:
                    $ref: '#/components/schemas/Operation'
                operationKey:
                    description: Suggested operation key for this target.
                    type: string
                ref:
                    description: Reference string a conforming binding entry can use under the governing binding specification.
                    type: string
            required:
                - ref
            type: object
        BindingContext:
            additionalProperties: true
            description: 'Opaque context supplied by value for one binding invocation. The contract neither requires nor exposes a context store; callers may assemble this object from per-call values, durable state, a credential broker, or any other source before invocation. Well-known credential fields: ''bearerToken'' (string), ''apiKey'' (string), ''apiKeys'' (object mapping a requirement''s ''name'' to its key), ''basic'' (object with ''username'' and ''password''), and ''accessToken'' / ''refreshToken'' / ''expiresAt'' for OAuth. Well-known transport fields: ''headers'' / ''cookies'' / ''environment'' (objects with string values) and ''metadata'' (object with arbitrary values). Well-known configuration field: ''configuration'' (object), keyed by configuration-point name and interpreted by the specification that defines each point. Implementations and callers MAY add fields for session state, consent, or other runtime data; consumers SHOULD ignore fields they do not recognize unless the governing binding specification says otherwise. Credential fields are secret, and any other field may also be secret according to its requirement family, binding specification, or application policy.'
            type: object
        BindingInvocationInput:
            additionalProperties: false
            description: 'Initial payload carried by the `open` input frame: identifies the binding to invoke and provides context.'
            properties:
                context:
                    $ref: '#/components/schemas/BindingContext'
                ref:
                    description: Reference within the binding source.
                    type: string
                source:
                    $ref: '#/components/schemas/Source'
            required:
                - source
                - ref
            type: object
        BindingInvokerInputFrame:
            description: 'One frame from the caller into invokeBinding. The caller streams a sequence: exactly one `open` frame first (carrying the BindingInvocationInput), then zero or more `input` frames carrying values to deliver to the underlying binding, then exactly one `close` frame signaling no more input.'
            discriminator:
                propertyName: kind
            oneOf:
                - additionalProperties: false
                  description: Open the invocation. MUST be the first frame on the input stream.
                  properties:
                    input:
                        $ref: '#/components/schemas/BindingInvocationInput'
                    kind:
                        const: open
                  required:
                    - kind
                    - input
                  title: open
                  type: object
                - additionalProperties: false
                  description: Write one input value to the underlying binding. The value's schema is determined by the underlying binding's operation, not by this contract.
                  properties:
                    kind:
                        const: input
                    value:
                        description: One input value, opaque at this layer.
                  required:
                    - kind
                    - value
                  title: input
                  type: object
                - additionalProperties: false
                  description: Caller signals that no more input frames will be sent. Idempotent.
                  properties:
                    kind:
                        const: close
                  required:
                    - kind
                  title: close
                  type: object
        BindingInvokerOutputFrame:
            description: 'One frame from the service back to the caller. The service streams a sequence: zero or more non-terminal frames (`output`, `input_closed`) followed by exactly one terminal frame (`complete` or `error`).'
            discriminator:
                propertyName: kind
            oneOf:
                - additionalProperties: false
                  description: One output value from the underlying binding. The value's schema is determined by the underlying binding's operation, not by this contract.
                  properties:
                    kind:
                        const: output
                    value:
                        description: One output value, opaque at this layer.
                  required:
                    - kind
                    - value
                  title: output
                  type: object
                - additionalProperties: false
                  description: Binding has closed the input side from its end (e.g., a unary binding closes input after the first read). Subsequent caller `input` frames are ignored (never written; see rule 3). The invocation continues; outputs may still flow.
                  properties:
                    kind:
                        const: input_closed
                  required:
                    - kind
                  title: input_closed
                  type: object
                - additionalProperties: false
                  description: 'Terminal: the underlying binding completed normally. MUST be the last frame.'
                  properties:
                    kind:
                        const: complete
                  required:
                    - kind
                  title: complete
                  type: object
                - additionalProperties: false
                  description: 'Terminal: the underlying binding failed. MUST be the last frame. Carries a structured InvocationError.'
                  properties:
                    error:
                        $ref: '#/components/schemas/InvocationError'
                    kind:
                        const: error
                  required:
                    - kind
                    - error
                  title: error
                  type: object
        BindingListEntry:
            additionalProperties: false
            description: A binding from the interface's bindings map, with its key.
            properties:
                deprecated:
                    description: Whether the binding is deprecated.
                    type: boolean
                inputTransform:
                    description: Whether the binding declares an input transform.
                    type: boolean
                key:
                    description: The binding's key in the interface's bindings map.
                    type: string
                operation:
                    description: The operation this binding realizes.
                    type: string
                outputTransform:
                    description: Whether the binding declares an output transform.
                    type: boolean
                preference:
                    description: The author-declared selection preference, when set.
                    type: number
                ref:
                    description: The binding-specification reference into the source.
                    type: string
                source:
                    description: The source key this binding invokes.
                    type: string
            required:
                - key
                - operation
                - source
            type: object
        BindingSpecInfo:
            description: Information about a supported binding specification.
            properties:
                bindingSpec:
                    description: Binding specification identifier, exact and opaque (e.g., openbindings.openapi@1, openbindings.mcp@1).
                    type: string
                description:
                    description: Human-readable description of this binding specification.
                    type: string
            required:
                - bindingSpec
            type: object
        BindingSpecPreference:
            additionalProperties: false
            description: A preference override scoped to one (operation, format) pair — ob's extra granularity beyond the delegate-manager contract's per-operation index. It replaces both the delegate-level and the per-operation preference when resolving that operation for that binding-source format.
            properties:
                bindingSpec:
                    description: The binding-source format this override is scoped to (e.g. grpc, openapi@3.1).
                    type: string
                operation:
                    description: The operation identifier this override is scoped to.
                    type: string
                preference:
                    description: The scoped preference value; higher is more preferred.
                    type: number
            required:
                - operation
                - bindingSpec
                - preference
            type: object
        CodegenInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                language:
                    description: Target language for the generated invoker.
                    enum:
                        - typescript
                        - go
                    type: string
                package:
                    description: Go package name (Go only; default derived from the interface name).
                    type: string
            required:
                - interface
                - language
            type: object
        CodegenOutput:
            additionalProperties: false
            properties:
                code:
                    description: The generated source code.
                    type: string
                language:
                    enum:
                        - typescript
                        - go
                    type: string
            required:
                - language
                - code
            type: object
        CompareInterfacesInput:
            additionalProperties: false
            properties:
                baseline:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                comparison:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                fromSources:
                    description: Compare the baseline against what its binding sources produce.
                    type: boolean
                only:
                    description: Scope to a specific source key (requires fromSources).
                    type: string
            required:
                - baseline
            type: object
        ComparisonInputDescriptor:
            additionalProperties: false
            description: 'Provenance of one compared document: where it came from and its canonical content hash.'
            properties:
                content_sha256:
                    type: string
                label:
                    enum:
                        - left
                        - right
                    type: string
                source:
                    description: Locator kind (e.g. file, http, exec); empty for inline documents.
                    type: string
                uri:
                    type: string
            required:
                - source
                - uri
                - content_sha256
                - label
            type: object
        CompatibilityReport:
            additionalProperties: true
            description: 'An ob-comparison-report/v1 document. The target interface rides the report''s left side, the candidate its right; operations are paired by key+alias resolution (OBI-T-12) and judged directionally. A report, not a binary verdict: the summary verdict is compatible, incompatible, or indeterminate. Reserved section arrays (schemas, metadata, sources, bindings, transforms, security) accompany operations.'
            properties:
                format_version:
                    description: Report convention identifier (ob-comparison-report/v1).
                    type: string
                generated_at:
                    type: string
                inputs:
                    additionalProperties: false
                    description: Provenance descriptors for the two compared documents.
                    properties:
                        left:
                            $ref: '#/components/schemas/ComparisonInputDescriptor'
                        right:
                            $ref: '#/components/schemas/ComparisonInputDescriptor'
                    required:
                        - left
                        - right
                    type: object
                mode:
                    description: Comparison mode (e.g. subsume).
                    type: string
                operations:
                    description: 'Per-operation deltas: pairing status (paired, only_left, only_right), directional input/output schema verdicts, and findings.'
                    items:
                        type: object
                    type: array
                profile:
                    description: Schema comparison profile and hash (e.g. OB-2020-12@local).
                    type: string
                summary:
                    additionalProperties: true
                    properties:
                        categories:
                            additionalProperties: false
                            properties:
                                breaking:
                                    type: integer
                                compliance:
                                    type: integer
                                non_breaking:
                                    type: integer
                                structural:
                                    type: integer
                            type: object
                        counts:
                            additionalProperties:
                                type: integer
                            description: Finding counts keyed by finding kind.
                            type: object
                        coverage:
                            additionalProperties: false
                            properties:
                                only_left:
                                    type: integer
                                only_right:
                                    type: integer
                                paired:
                                    type: integer
                                paired_via:
                                    additionalProperties: false
                                    properties:
                                        alias:
                                            type: integer
                                        direct:
                                            type: integer
                                    type: object
                                total_operations:
                                    type: integer
                            type: object
                        verdict:
                            enum:
                                - compatible
                                - incompatible
                                - indeterminate
                            type: string
                    required:
                        - verdict
                    type: object
                suppressed:
                    description: Findings suppressed by suppression rules, with the rule that matched.
                    items:
                        type: object
                    type: array
                tool:
                    additionalProperties: false
                    properties:
                        name:
                            type: string
                        version:
                            type: string
                    required:
                        - name
                        - version
                    type: object
            required:
                - format_version
                - profile
                - mode
                - tool
                - generated_at
                - inputs
                - summary
                - operations
            type: object
        ConformAction:
            additionalProperties: false
            description: A single change conform made or would make to the target.
            properties:
                action:
                    description: scaffold (add a missing operation), replace (update a drifted one), skip, or compatible (already conforms).
                    enum:
                        - scaffold
                        - replace
                        - skip
                        - compatible
                    type: string
                details:
                    description: Human-readable description of the change.
                    type: string
                operation:
                    description: The operation key the change concerns.
                    type: string
            required:
                - operation
                - action
            type: object
        ConformInput:
            additionalProperties: false
            description: 'conform input: `interface` is the reference contract whose operations `target` must satisfy; `target` is the interface scaffolded to conform, returned modified as `interface` in the result.'
            properties:
                dryRun:
                    description: Report the changes without applying them.
                    type: boolean
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                target:
                    $ref: '#/components/schemas/OpenBindingsInterface'
            required:
                - interface
                - target
            type: object
        ConformResult:
            additionalProperties: true
            description: The conformed target document plus a report of each change made or proposed.
            properties:
                actions:
                    items:
                        $ref: '#/components/schemas/ConformAction'
                    type: array
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                interfaceName:
                    description: Display name of the reference interface being conformed to.
                    type: string
                modified:
                    description: Whether the target was changed (false under dryRun or when already conformant).
                    type: boolean
            required:
                - interface
                - actions
                - modified
            type: object
        Context:
            additionalProperties: true
            description: 'Opaque per-target context payload: credentials, session state, headers, cookies, environment, metadata, or any other invoker-managed state. Well-known fields include bearerToken, apiKey, basic, headers, cookies, environment, metadata.'
            type: object
        ContextKeyInput:
            additionalProperties: false
            properties:
                key:
                    description: Context store key.
                    type: string
            required:
                - key
            type: object
        ContextRequiredDetails:
            description: 'The `details` payload of an InvocationError whose `code` is CONTEXT_REQUIRED, and the return shape of this contract''s preflight operation. Enumerates the context the invoker needs before it can proceed. `alternatives` are disjunctive: satisfying ANY one suffices. The `requirements` within a single alternative are conjunctive: ALL must be satisfied. This OR-of-AND shape captures real authentication semantics such as ''OAuth2 OR (apiKey AND clientCert)'', which a flat list cannot. A challenge is a scope, not a hint: a caller that resolves it MUST provision only the context needed for one selected alternative and MUST NOT disclose unrelated credentials. The interface supplies context by value and exposes no context-store access.'
            properties:
                alternatives:
                    description: Disjunctive set of ways to satisfy the requirement. A resolving caller selects one alternative whose every requirement it can resolve and provisions only the context needed for that alternative, never unrelated credentials.
                    items:
                        properties:
                            requirements:
                                description: 'Conjunctive set: every requirement in this alternative must be resolved for the alternative to be satisfied.'
                                items:
                                    $ref: '#/components/schemas/ContextRequirement'
                                minItems: 1
                                type: array
                        required:
                            - requirements
                        type: object
                    minItems: 1
                    type: array
                target:
                    description: Opaque identifier for the concrete destination or context scope the invoker is about to use. A runtime MAY use it to scope resolution or reuse and MAY compare it with independently derived source information before releasing secrets. Interpretation, verification, normalization, hierarchy, key derivation, and persistence policy are outside this contract.
                    type: string
            required:
                - target
                - alternatives
            type: object
        ContextRequirement:
            additionalProperties: true
            description: 'One prerequisite that must be satisfied before a binding can be invoked. `type` names the requirement family; the remaining fields are type-specific. The well-known `auth.*` family resolves into BindingContext credential fields: `auth.bearer` produces ''bearerToken'', `auth.apiKey` produces ''apiKey'' (or a scheme-keyed entry in ''apiKeys'' when the requirement carries a `name`), `auth.basic` produces ''basic'', and `auth.oauth2` produces ''accessToken'' (carrying flow fields such as ''grantType'', ''authorizeUrl'', ''tokenUrl'', and ''scopes''). The `config.value` family carries a configuration value a binding needs but the artifact does not supply: it carries ''point'' and ''key'' (and optional ''choices'') and resolves into the ''configuration'' context field under ''point''. Other families (e.g. ''approval.user'', ''account.link'') resolve into their own context fields. Resolution architecture and value secrecy beyond the always-secret credential fields are determined by the requirement family, governing binding specification, and caller.'
            properties:
                choices:
                    description: 'config.value only: values declared by the source artifact, suitable for rendering as a picker. Whether an off-list value is valid is defined by the governing binding specification: a closed artifact enum is enforced; an advisory list remains advisory.'
                    items:
                        type: string
                    type: array
                description:
                    description: Human-readable description shown to a user or operator during resolution (e.g. an approval prompt message).
                    type: string
                durable:
                    description: Whether resolved context for this requirement MAY be persisted and reused for later invocations (true), or MUST be satisfied freshly and MUST NOT be persisted or reused (false). Defaults to true. This permission does not require persistence or prescribe a store, key, or reuse policy.
                    type: boolean
                key:
                    description: 'config.value only: the specific value needed within ''point'' — a server-variable name, or ''address'' for a whole channel address.'
                    type: string
                name:
                    description: The scheme name as the source artifact declares it (e.g. an OpenAPI securitySchemes key). Distinguishes two requirements of the same type within one alternative — two ANDed API keys are otherwise indistinguishable — and keys scheme-scoped credential lookup (see BindingContext's 'apiKeys').
                    type: string
                point:
                    description: 'config.value only: the binding-specification configuration point the value belongs to (''server'', ''address'', a family''s decode point, …). The resolved value is carried in the ''configuration'' context field under this point; the value''s shape there is the invoker''s own (configuration carriage is implementation surface, not contract).'
                    type: string
                type:
                    description: Requirement type identifier, e.g. 'auth.bearer', 'auth.oauth2', 'auth.basic', 'auth.apiKey', 'approval.user', 'config.value'. An unrecognized type is unsatisfiable by a runtime that has no way to satisfy it. An invoker may surface an artifact-defined scheme as an extension requirement only when it knows how the resulting context will be applied faithfully; an invoker that cannot represent or apply a prerequisite refuses before dispatch rather than emitting a satisfiable-looking challenge or attempting the interaction without it.
                    type: string
            required:
                - type
            type: object
        ContextSummary:
            additionalProperties: false
            description: Non-secret metadata about a stored context entry. Never includes secret values.
            properties:
                cookieCount:
                    type: integer
                envCount:
                    type: integer
                hasCredentials:
                    type: boolean
                headerCount:
                    type: integer
                loadError:
                    description: Set if the entry could not be parsed.
                    type: string
                metadataCount:
                    type: integer
                url:
                    description: Context store key (normalized API origin or other stable identifier).
                    type: string
            required:
                - url
                - hasCredentials
            type: object
        DelegateBindingSpecInfo:
            additionalProperties: false
            properties:
                bindingSpec:
                    description: Format token the delegate handles (e.g. grpc, openapi@3.1).
                    type: string
                description:
                    description: Human-readable description of the format, when the delegate provides one.
                    type: string
            required:
                - bindingSpec
            type: object
        DelegateCapability:
            description: 'One of ob''s three binding-specification handling needs, derived from a minimal operation subset of a published interface: invoke (binding-invoker), synthesize (interface-synthesizer), inspect (source-inspector). A delegate offers whichever subsets it satisfies; operations outside a subset remain independent capabilities.'
            enum:
                - invoke
                - synthesize
                - inspect
            type: string
        DelegateLocationInput:
            additionalProperties: false
            properties:
                location:
                    description: 'Delegate location: the exec: or http(s) URL of the delegate''s OpenBindings interface.'
                    type: string
            required:
                - location
            type: object
        DelegateSummary:
            additionalProperties: false
            description: 'A registered delegate: its identity, the snapshot of what it carries, ob''s derived routing data, and its selection preferences.'
            properties:
                bindingSpecPreferences:
                    description: Preference overrides scoped to one (operation, format) pair — ob's extra granularity beyond the delegate-manager contract's per-operation index.
                    items:
                        $ref: '#/components/schemas/BindingSpecPreference'
                    type: array
                bindingSpecs:
                    description: The formats the delegate reported handling when last resolved.
                    items:
                        $ref: '#/components/schemas/DelegateBindingSpecInfo'
                    type: array
                builtin:
                    description: True for ob's own native handling — the self-delegate.
                    type: boolean
                capabilities:
                    description: Which of ob's format capabilities the delegate satisfies, checked by conformance at registration.
                    items:
                        $ref: '#/components/schemas/DelegateCapability'
                    type: array
                contentHash:
                    description: 'Digest of the delegate''s interface document as last resolved (sha256: over its RFC 8785 canonical form). Pins the snapshot; opaque — compare for equality, don''t recompute.'
                    type: string
                location:
                    description: 'The reference the delegate is registered under (exec: or http(s) URL). The self-delegate''s location is "ob".'
                    type: string
                name:
                    description: 'Display name: the delegate OBI''s name, or one derived from its location.'
                    type: string
                operationPreferences:
                    additionalProperties:
                        type: number
                    description: Per-operation preference overrides, keyed by operation identifier. The override replaces the delegate-level preference when resolving that operation.
                    type: object
                operations:
                    description: 'Every operation identifier the delegate answers to — the keys and aliases its interface declared when last resolved. A snapshot: re-registering the location refreshes it.'
                    items:
                        type: string
                    type: array
                preference:
                    description: Delegate-level selection preference — the default for every operation it carries. Higher is more preferred; absent is the baseline.
                    type: number
            required:
                - location
                - operations
            type: object
        DemoInput:
            additionalProperties: false
            properties:
                grpcPort:
                    description: gRPC server port.
                    type: integer
                httpPort:
                    description: HTTP server port.
                    type: integer
            type: object
        DetachOperationInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
