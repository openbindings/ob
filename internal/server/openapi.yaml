        InterfaceStatusInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
            required:
                - interface
            type: object
        InvocationError:
            description: Structured error carried by an `error` output frame. Indicates terminal failure of the invocation. Codes named by a normative rule of either invoker contract — binding-invoker or its operation-invoker peer — (CONTEXT_REQUIRED, ERR_PROTOCOL, ERR_TRANSPORT_CLOSED, ERR_CANCELLED, ERR_VALIDATION_FAILED, ERR_BINDING_NOT_FOUND, ERR_BINDING_SELECTION_REQUIRED) are normative where named; other codes are recommended conventions (see the binding-invoker README's registry), and consumers SHOULD handle unknown codes gracefully.
            properties:
                category:
                    description: The normative classification axis consumers branch on. One of a fixed, closed set; a consumer that meets an unknown value treats it as `permanent`. `context` is the resolve-and-retry hinge (CONTEXT_REQUIRED); `auth` means supplied credentials were rejected; `cancelled` means the caller ended the invocation; `transient` is a lower-layer condition that may clear on its own; `service` means the target was reached and returned an error of its own; `validation` means a value or the schema graph failed the validation claim; `protocol` means the frame or invocation contract was violated; `permanent` is terminal.
                    enum:
                        - context
                        - auth
                        - cancelled
                        - transient
                        - service
                        - validation
                        - protocol
                        - permanent
                    type: string
                code:
                    description: Machine-readable error code (e.g., ERR_CANCELLED, ERR_VALIDATION_FAILED, ERR_PROTOCOL, CONTEXT_REQUIRED).
                    type: string
                details:
                    description: Optional structured details specific to the error code. For code CONTEXT_REQUIRED, `details` is a ContextRequiredDetails object.
                effects:
                    description: 'Side-effect possibility gating safe retry, present where retry is in question (categories `transient` and `service`). `none`: the call''s side effects provably did not take hold — safe to retry. `possible`: the call may have taken effect — not safe to auto-retry a non-idempotent operation. `definite`: the call took effect. Absent means treat as `possible`.'
                    enum:
                        - none
                        - possible
                        - definite
                    type: string
                message:
                    description: Human-readable description.
                    type: string
            required:
                - code
                - message
                - category
            type: object
        ListBindingsInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: Scope the listing to a single operation's bindings.
                    type: string
            required:
                - interface
            type: object
        ListOperationAliasesInput:
