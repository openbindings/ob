            additionalProperties: false
            anyOf:
                - required:
                    - location
                - required:
                    - content
            description: A binding source to synthesize an interface from.
            properties:
                bindingSpec:
                    description: Binding specification identifier governing this source.
                    type: string
                content:
                    description: Content provided directly.
                description:
                    description: Human-readable description for this source.
                    type: string
                embed:
                    description: If true, embed content inline in the output.
                    type: boolean
                location:
                    description: Location to fetch content from (path or URL).
                    type: string
                name:
                    description: Key name for this binding source in the output.
                    type: string
                outputLocation:
                    description: Location to reference in the output.
                    type: string
            required:
                - bindingSpec
            type: object
        UnbindOperationInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any identifier.
                    type: string
                source:
                    description: Source key whose binding to remove.
                    type: string
            required:
                - interface
                - operation
                - source
            type: object
        ValidateInterfaceInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                strict:
                    description: Additionally reject unknown (non-x-) fields. A spec version newer than the tool supports is refused in every mode.
                    type: boolean
            required:
                - interface
            type: object
        ValidationReport:
            additionalProperties: true
            properties:
                problems:
                    items:
                        type: string
                    type: array
                valid:
                    type: boolean
                version:
                    description: The spec version the document declares.
                    type: string
            required:
                - valid
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: opaque
            scheme: bearer
            type: http
        oauth2Auth:
            flows:
                authorizationCode:
                    authorizationUrl: ${OB_SERVER_URL}/oauth/authorize
                    scopes: {}
                    tokenUrl: ${OB_SERVER_URL}/oauth/token
            type: oauth2
security:
    - oauth2Auth: []
    - bearerAuth: []
