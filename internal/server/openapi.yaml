            summary: Submit an OAuth consent decision.
    /oauth/token:
        post:
            operationId: oauthToken
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            additionalProperties: false
                            properties:
                                code:
                                    type: string
                                code_verifier:
                                    type: string
                                grant_type:
                                    const: authorization_code
                                    type: string
                                redirect_uri:
                                    format: uri
                                    type: string
                            required:
                                - grant_type
                                - code
                                - code_verifier
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    access_token:
                                        type: string
                                    expires_in:
                                        minimum: 0
                                        type: integer
                                    token_type:
                                        const: Bearer
                                        type: string
                                required:
                                    - access_token
                                    - token_type
                                    - expires_in
                                type: object
                    description: Access token.
            security: []
            summary: Exchange an authorization code for an access token.
    /openapi.yaml:
        get:
            operationId: getOpenAPISpec
            responses:
                "200":
                    content:
                        text/yaml:
                            schema:
                                type: string
                    description: Successful response.
            security: []
            summary: Return this OpenAPI document.
    /operations/preflight:
        post:
            description: 'Operation-level preflight, the by-reference counterpart to preflightBinding: resolve the named operation (or binding) on the supplied interface with invocation''s selection rules and preflight the selected binding under the binding-invoker contract. Returns that binding''s ContextRequiredDetails in the same shape a CONTEXT_REQUIRED challenge carries, or null. Advisory: it may omit requirements, null is always conformant, and invokeOperation''s live CONTEXT_REQUIRED challenge remains authoritative; invocation never requires a prior preflight. Context supplied here is used for this call alone and narrows the result to what it leaves unsatisfied. Preflight never dispatches the requested operation and does not pin a later selection; a resolution failure is this operation''s own error, not the binding''s answer. An unsuccessful completion means the binding could not answer and carries no prediction.'
            operationId: preflightOperation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OperationInvocationInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ContextRequiredDetails'
                                    - type: "null"
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: 'Operation-level preflight, the by-reference counterpart to preflightBinding: resolve the named operation (or binding) on the supplied interface with invocation''s selection rules and preflight the selected binding under the binding-invoker contract.'
    /sources/inspect:
        post:
            description: Inspect a binding source artifact and report the bindable targets it contains, before any interface is created. Lets tooling show a user what an artifact offers.
            operationId: inspectSource
            parameters:
                - description: 'OB-native execution option: perform the operation''s delegated role through exactly this enrolled registration ID (no built-in or alternate-provider fallback). Not part of the shared operation input.'
                  in: query
                  name: registration
                  required: false
                  schema:
                    minLength: 1
                    type: string
                  x-ob-native: true
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InspectSourceInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SourceInspection'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Inspect a binding source artifact and report the bindable targets it contains, before any interface is created.
    /spec/{name}:
        get:
            operationId: readSpecResource
            parameters:
                - in: path
                  name: name
                  required: true
                  schema:
                    enum:
                        - agent-primer.md
                        - quick-reference.md
                    type: string
            responses:
                "200":
                    content:
                        text/markdown:
                            schema:
                                type: string
                    description: Resource contents.
            summary: Read a bundled OpenBindings guidance resource.
components:
    schemas:
        AddOperationAliasInput:
            additionalProperties: false
            properties:
                aliases:
                    description: Satisfaction alias(es) to add.
                    items:
                        type: string
                    minItems: 1
                    type: array
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any existing identifier.
                    type: string
            required:
                - interface
                - operation
                - aliases
            type: object
        AddOperationInput:
            additionalProperties: false
            properties:
                aliases:
                    description: Satisfaction aliases — other interfaces' operation keys this operation also answers to (OBI-T-12).
                    items:
                        type: string
                    type: array
                description:
                    type: string
                idempotent:
                    description: Whether the new operation is idempotent.
                    type: boolean
                input:
                    description: JSON Schema for the new operation's input.
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                key:
                    description: Key for the new operation.
                    type: string
                output:
                    description: JSON Schema for the new operation's output.
                tags:
                    items:
                        type: string
                    type: array
            required:
                - interface
                - key
            type: object
        AddSourceInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                source:
                    $ref: '#/components/schemas/SynthesizeInterfaceSource'
            required:
                - interface
                - source
            type: object
        ApplyDelegateMigrationInput:
            additionalProperties: false
            properties:
                confirmQuiesced:
                    const: true
                    description: The operator's acknowledgment that every older ob process and other writer of the environment has been stopped. It is an acknowledgment, not proof.
                    type: boolean
                plan:
                    $ref: '#/components/schemas/DelegateMigrationPlan'
            required:
                - plan
                - confirmQuiesced
            type: object
        BindOperationInput:
            additionalProperties: false
            properties:
                force:
                    description: Overwrite an existing binding for this operation and source.
                    type: boolean
                inputTransform:
                    description: Inline JSONata transforming operation input to binding input.
                    type: string
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any identifier.
                    type: string
                outputTransform:
                    description: Inline JSONata transforming binding output to operation output.
                    type: string
                preference:
                    description: Author preference signal (higher = more preferred); this field does not itself select a binding.
                    type: number
                selector:
                    description: Source selector (wire identifier) to bind.
                    type: string
                source:
                    description: Registered source key.
                    type: string
                transformStub:
                    description: Scaffold identity transform stub(s) on shape mismatch.
                    type: boolean
            required:
                - interface
                - operation
                - source
                - selector
            type: object
        BindableTarget:
            description: A target admitted by the source's governing binding specification that can be framed as an OpenBindings operation. Any included framing is a sound projection of this same target.
            properties:
                operation:
                    $ref: '#/components/schemas/Operation'
                operationKey:
                    description: Suggested operation key for this target.
                    type: string
                selector:
                    description: Selector string a conforming binding entry can use under the governing binding specification.
                    type: string
            required:
                - selector
            type: object
        BindingContext:
            additionalProperties: true
            description: 'Opaque context supplied by value for one binding invocation. The contract neither requires nor exposes a context store; callers may assemble this object from per-call values, durable state, a credential broker, or any other source before invocation. The general named-credential field is ''credentials'': an object keyed by a requirement''s nonempty ''name''. For auth.bearer and auth.apiKey its named value is a string; for auth.basic it is an object with username and password; for auth.oauth2 it is an object whose accessToken is the applying credential and whose refreshToken, expiresAt, and clientSecret are optional lifecycle values. Unnamed or unambiguous single-scheme conveniences remain ''bearerToken'', ''apiKey'', ''basic'', and ''accessToken'' / ''refreshToken'' / ''expiresAt''; the historical ''apiKeys'' named map remains accepted for auth.apiKey. Well-known transport fields: ''headers'' / ''cookies'' / ''environment'' (objects with string values) and ''metadata'' (object with arbitrary values). Well-known configuration field: ''configuration'' (object), keyed by configuration-point name and interpreted by the specification that defines each point. A config.value requirement''s relative JSON Pointer path addresses within configuration[point]; an empty path addresses the entire point. The operation-invoker contract defines configuration.selection as an ordered array of binding-key strings. Implementations and callers MAY add fields for session state, consent, or other runtime data; consumers SHOULD ignore fields they do not recognize unless the governing binding specification says otherwise. Every value in credentials and the single-scheme credential fields is secret, and any other field may also be secret according to its requirement family, binding specification, or application policy.'
            type: object
        BindingInvocationInput:
            additionalProperties: false
            description: 'Initial payload carried by the `open` input frame: identifies the binding to invoke and provides context.'
            properties:
                context:
                    $ref: '#/components/schemas/BindingContext'
                selector:
                    description: Selector within the binding source.
                    type: string
                source:
                    $ref: '#/components/schemas/Source'
            required:
                - source
                - selector
            type: object
        BindingInvokerInputFrame:
            description: 'One frame from the caller into invokeBinding. The caller streams a sequence: exactly one `open` frame first (carrying the BindingInvocationInput), then zero or more `input` frames carrying values to deliver to the underlying binding, then exactly one `close` frame signaling no more input.'
            discriminator:
                propertyName: kind
            oneOf:
                - additionalProperties: false
                  description: Open the invocation. MUST be the first frame on the input stream.
                  properties:
                    input:
                        $ref: '#/components/schemas/BindingInvocationInput'
                    kind:
                        const: open
                  required:
                    - kind
                    - input
                  title: open
                  type: object
                - additionalProperties: false
                  description: Write one input value to the underlying binding. The value's schema is determined by the underlying binding's operation, not by this contract.
                  properties:
                    kind:
                        const: input
                    value:
                        description: One input value, opaque at this layer.
                  required:
                    - kind
                    - value
                  title: input
                  type: object
                - additionalProperties: false
                  description: Caller signals that no more input frames will be sent. Idempotent.
                  properties:
                    kind:
                        const: close
                  required:
                    - kind
                  title: close
                  type: object
        BindingInvokerOutputFrame:
            description: 'One frame from the service back to the caller. The service streams a sequence: zero or more non-terminal frames (`output`, `input_closed`) followed by exactly one terminal frame (`complete` or `error`).'
            discriminator:
                propertyName: kind
            oneOf:
                - additionalProperties: false
                  description: One output value from the underlying binding. The value's schema is determined by the underlying binding's operation, not by this contract.
                  properties:
                    kind:
                        const: output
                    value:
                        description: One output value, opaque at this layer.
                  required:
                    - kind
                    - value
                  title: output
                  type: object
                - additionalProperties: false
                  description: Binding has closed the input side from its end (e.g., a unary binding closes input after the first read). Subsequent caller `input` frames are ignored (never written; see rule 3). The invocation continues; outputs may still flow.
                  properties:
                    kind:
                        const: input_closed
                  required:
                    - kind
                  title: input_closed
                  type: object
                - additionalProperties: false
                  description: 'Terminal: the underlying binding completed normally. MUST be the last frame.'
                  properties:
                    kind:
                        const: complete
                  required:
                    - kind
                  title: complete
                  type: object
                - additionalProperties: false
                  description: 'Terminal: the underlying binding failed. MUST be the last frame. Carries a structured InvocationError.'
                  properties:
                    error:
                        $ref: '#/components/schemas/InvocationError'
                    kind:
                        const: error
                  required:
                    - kind
                    - error
                  title: error
                  type: object
        BindingListEntry:
            additionalProperties: false
            description: A binding from the interface's bindings map, with its key.
            properties:
                deprecated:
                    description: Whether the binding is deprecated.
                    type: boolean
                inputTransform:
                    description: Whether the binding declares an input transform.
                    type: boolean
                key:
                    description: The binding's key in the interface's bindings map.
                    type: string
                operation:
                    description: The operation this binding realizes.
                    type: string
                outputTransform:
                    description: Whether the binding declares an output transform.
                    type: boolean
                preference:
                    description: The author-declared selection preference, when set.
                    type: number
                selector:
                    description: The binding-specification selector into the source.
                    type: string
                source:
                    description: The source key this binding invokes.
                    type: string
            required:
                - key
                - operation
                - source
            type: object
        BindingSpecInfo:
            description: Information about a supported binding specification.
            properties:
                bindingSpec:
                    description: Binding specification identifier, exact and opaque (e.g., openbindings.openapi-3.1@1, openbindings.mcp@1).
                    type: string
                description:
                    description: Human-readable description of this binding specification.
                    type: string
            required:
                - bindingSpec
            type: object
        BindingSpecPreference:
            additionalProperties: false
            description: A preference override scoped to one (operation, format) pair — ob's extra granularity beyond the delegate-manager contract's per-operation index. It replaces both the delegate-level and the per-operation preference when resolving that operation for that binding-source format.
            properties:
                bindingSpec:
                    description: The binding-source format this override is scoped to (e.g. grpc, openapi@3.1).
                    type: string
                operation:
                    description: The operation identifier this override is scoped to.
                    type: string
                preference:
                    description: The scoped preference value; higher is more preferred.
                    type: number
            required:
                - operation
                - bindingSpec
                - preference
            type: object
        BindingSpecVerdict:
            description: Authoritative support verdict for one exact binding-specification identifier. Future optional fields may annotate this verdict but never qualify or soften supported.
            properties:
                bindingSpec:
                    description: Exact binding-specification identifier token as supplied by the caller.
                    type: string
                supported:
                    description: Strict support verdict. True warrants that this implementation implements the specification denoted by the exact bindingSpec string, as published; false is an unqualified refusal.
                    type: boolean
            required:
                - bindingSpec
                - supported
            type: object
        CodegenInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                language:
                    description: Target language for the generated invoker.
                    enum:
                        - typescript
                        - go
                    type: string
                package:
                    description: Go package name (Go only; default derived from the interface name).
                    type: string
            required:
                - interface
                - language
            type: object
        CodegenOutput:
            additionalProperties: false
            properties:
                code:
                    description: The generated source code.
                    type: string
                language:
                    enum:
                        - typescript
                        - go
                    type: string
            required:
                - language
                - code
            type: object
        CompareInterfacesInput:
            additionalProperties: false
            properties:
                baseline:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                comparison:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                fromSources:
                    description: Compare the baseline against what its binding sources produce.
                    type: boolean
                only:
                    description: Scope to a specific source key (requires fromSources).
                    type: string
            required:
                - baseline
            type: object
        ComparisonInputDescriptor:
            additionalProperties: false
            description: 'Provenance of one compared document: where it came from and its canonical content hash.'
            properties:
                content_sha256:
                    type: string
                label:
                    enum:
                        - left
                        - right
                    type: string
                source:
                    description: Locator kind (e.g. file, http, exec); empty for inline documents.
                    type: string
                uri:
                    type: string
            required:
                - source
                - uri
                - content_sha256
                - label
            type: object
        CompatibilityReport:
            additionalProperties: true
            description: 'An ob-comparison-report/v1 document. The target interface rides the report''s left side, the candidate its right; operations are paired by key+alias resolution (OBI-T-12) and judged directionally. A report, not a binary verdict: the summary verdict is compatible, incompatible, or indeterminate. Reserved section arrays (schemas, metadata, sources, bindings, transforms, security) accompany operations.'
            properties:
                format_version:
                    description: Report convention identifier (ob-comparison-report/v1).
                    type: string
                generated_at:
                    type: string
                inputs:
                    additionalProperties: false
                    description: Provenance descriptors for the two compared documents.
                    properties:
                        left:
                            $ref: '#/components/schemas/ComparisonInputDescriptor'
                        right:
                            $ref: '#/components/schemas/ComparisonInputDescriptor'
                    required:
                        - left
                        - right
                    type: object
                mode:
                    description: Comparison mode (e.g. subsume).
                    type: string
                operations:
                    description: 'Per-operation deltas: pairing status (paired, only_left, only_right), directional input/output schema verdicts, and findings.'
                    items:
                        type: object
                    type: array
                profile:
                    description: Schema comparison profile and hash (e.g. OB-2020-12@local).
                    type: string
                summary:
                    additionalProperties: true
                    properties:
                        categories:
                            additionalProperties: false
                            properties:
                                breaking:
                                    type: integer
                                compliance:
                                    type: integer
                                non_breaking:
                                    type: integer
                                structural:
                                    type: integer
                            type: object
                        counts:
                            additionalProperties:
                                type: integer
                            description: Finding counts keyed by finding kind.
                            type: object
                        coverage:
                            additionalProperties: false
                            properties:
                                only_left:
                                    type: integer
                                only_right:
                                    type: integer
                                paired:
                                    type: integer
                                paired_via:
                                    additionalProperties: false
                                    properties:
                                        alias:
                                            type: integer
                                        direct:
                                            type: integer
                                    type: object
                                total_operations:
                                    type: integer
                            type: object
                        verdict:
                            enum:
                                - compatible
                                - incompatible
                                - indeterminate
                            type: string
                    required:
                        - verdict
                    type: object
                suppressed:
                    description: Findings suppressed by suppression rules, with the rule that matched.
                    items:
                        type: object
                    type: array
                tool:
                    additionalProperties: false
                    properties:
                        name:
                            type: string
                        version:
                            type: string
                    required:
                        - name
                        - version
                    type: object
            required:
                - format_version
                - profile
                - mode
                - tool
                - generated_at
                - inputs
                - summary
                - operations
            type: object
        ConformAction:
            additionalProperties: false
            description: A single change conform made or would make to the target.
            properties:
                action:
                    description: scaffold (add a missing operation), replace (update a drifted one), skip, or compatible (already conforms).
                    enum:
                        - scaffold
                        - replace
                        - skip
                        - compatible
                    type: string
                details:
                    description: Human-readable description of the change.
                    type: string
                operation:
                    description: The operation key the change concerns.
                    type: string
            required:
                - operation
                - action
            type: object
        ConformInput:
            additionalProperties: false
            description: 'conform input: `interface` is the reference contract whose operations `target` must satisfy; `target` is the interface scaffolded to conform, returned modified as `interface` in the result.'
            properties:
                dryRun:
                    description: Report the changes without applying them.
                    type: boolean
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                target:
                    $ref: '#/components/schemas/OpenBindingsInterface'
            required:
                - interface
                - target
            type: object
        ConformResult:
            additionalProperties: true
            description: The conformed target document plus a report of each change made or proposed.
            properties:
                actions:
                    items:
                        $ref: '#/components/schemas/ConformAction'
                    type: array
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                interfaceName:
                    description: Display name of the reference interface being conformed to.
                    type: string
                modified:
                    description: Whether the target was changed (false under dryRun or when already conformant).
                    type: boolean
            required:
                - interface
                - actions
                - modified
            type: object
        Context:
            additionalProperties: true
            description: 'Opaque per-target context payload: credentials, session state, headers, cookies, environment, metadata, or any other invoker-managed state. Well-known fields include bearerToken, apiKey, basic, headers, cookies, environment, metadata.'
            type: object
        ContextKeyInput:
            additionalProperties: false
            properties:
                key:
                    description: Context store key.
                    type: string
            required:
                - key
            type: object
        ContextRequiredDetails:
            additionalProperties: false
            description: 'The `data` value of an InvocationError whose `code` is CONTEXT_REQUIRED, and the return shape of this contract''s preflight operation. Enumerates the context the invoker needs before it can proceed. `alternatives` are disjunctive: satisfying ANY one suffices. The `requirements` within a single alternative are conjunctive: ALL must be satisfied. This OR-of-AND shape captures real authentication semantics such as ''OAuth2 OR (apiKey AND clientCert)'', which a flat list cannot. A challenge is a scope, not a hint: a caller that resolves it MUST provision only the context needed for one selected alternative and MUST NOT disclose unrelated credentials. The interface supplies context by value and exposes no context-store access.'
            properties:
                alternatives:
                    description: Disjunctive set of ways to satisfy the requirement. A resolving caller selects one alternative whose every requirement it can resolve and provisions only the context needed for that alternative, never unrelated credentials.
                    items:
                        additionalProperties: false
                        properties:
                            requirements:
                                description: 'Conjunctive set: every requirement in this alternative must be resolved for the alternative to be satisfied.'
                                items:
                                    $ref: '#/components/schemas/ContextRequirement'
                                minItems: 1
                                type: array
                        required:
                            - requirements
                        type: object
                    minItems: 1
                    type: array
                target:
                    description: Opaque identifier for the concrete destination or context scope asserted by the invoker. A runtime MAY use it to scope resolution or reuse. Before releasing a reusable secret on an assertion from outside its trust boundary, a resolver MUST validate that assertion against independently derived information; an in-process resolver MAY deliberately include its co-located invoker in the trust boundary. Interpretation, normalization, hierarchy, key derivation, and persistence policy are otherwise outside this contract.
                    type: string
            required:
                - target
                - alternatives
            type: object
        ContextRequirement:
            additionalProperties: true
            description: 'One prerequisite that must be satisfied before a binding can be invoked. `type` names the requirement family; the remaining fields are type-specific. A named well-known `auth.*` requirement resolves at BindingContext.credentials[name]: a string for `auth.bearer` and `auth.apiKey`, a username/password object for `auth.basic`, or an OAuth object beginning with accessToken for `auth.oauth2`. Unnamed or unambiguous single-scheme requirements use the corresponding bearerToken, apiKey, basic, or flat OAuth conveniences; historical apiKeys[name] remains accepted for `auth.apiKey`. OAuth requirements may carry flow fields such as grantType, authorizeUrl, tokenUrl, and scopes. The `config.value` family carries a configuration value a binding needs but the artifact does not supply: it carries ''point'' and a relative JSON Pointer ''path'' (plus an optional engine-asserted ''schema'') and resolves within BindingContext.configuration. Other families (e.g. ''approval.user'', ''account.link'') resolve into their own context fields. Resolution architecture and value secrecy beyond the always-secret credential fields are determined by the requirement family, governing binding specification, and caller.'
            properties:
                description:
                    description: Human-readable description shown to a user or operator during resolution (e.g. an approval prompt message).
                    type: string
                durable:
                    default: false
                    description: Whether resolved context for this requirement MAY be persisted and reused for later invocations (true), or MUST be satisfied freshly and MUST NOT be persisted or reused (false). Defaults to false. This permission does not require persistence or prescribe a store, key, or reuse policy.
                    type: boolean
                name:
                    description: The scheme name as the source artifact declares it (e.g. an OpenAPI securitySchemes key). Distinguishes multiple requirements of the same family and keys scheme-scoped lookup in BindingContext.credentials.
                    minLength: 1
                    type: string
                path:
                    description: 'config.value only: RFC 6901 JSON Pointer relative to configuration[point]. The empty pointer addresses the whole point; ''/variables/region'' addresses a nested member; ''/value'' addresses a member literally named value.'
                    pattern: ^(|/(?:[^~]|~[01])*(?:/(?:[^~]|~[01])*)*)$
                    type: string
                point:
                    description: 'config.value only: the binding-specification configuration point the value belongs to (''server'', ''address'', a family''s decode point, …).'
                    type: string
                schema:
                    description: 'config.value only: an engine-asserted JSON Schema for the value addressed by point and path. Derived from the source artifact where the artifact speaks, supplied by the binding-specification implementation where that specification pins a shape, and absent where nothing does; absence means the value is unconstrained. An ''enum'' declares the closed admissible set and satisfaction validates against it; ''examples'' are advisory suggestions and an off-list value remains valid.'
                    type: object
                type:
                    description: Requirement type identifier, e.g. 'auth.bearer', 'auth.oauth2', 'auth.basic', 'auth.apiKey', 'approval.user', 'config.value'. An unrecognized type is unsatisfiable by a runtime that has no way to satisfy it. An invoker may surface an artifact-defined scheme as an extension requirement only when it knows how the resulting context will be applied faithfully; an invoker that cannot represent or apply a prerequisite refuses before dispatch rather than emitting a satisfiable-looking challenge or attempting the interaction without it.
                    minLength: 1
                    type: string
            required:
                - type
            type: object
        ContextSummary:
            additionalProperties: false
            description: Non-secret metadata about a stored context entry. Never includes secret values.
            properties:
                cookieCount:
                    type: integer
                envCount:
                    type: integer
                hasCredentials:
                    type: boolean
                headerCount:
                    type: integer
                loadError:
                    description: Set if the entry could not be parsed.
                    type: string
                metadataCount:
                    type: integer
                url:
                    description: Context store key (normalized API origin or other stable identifier).
                    type: string
            required:
                - url
                - hasCredentials
            type: object
        DelegateCapability:
            description: 'One of ob''s three delegation roles: invoke (Binding Invoker), synthesize (Interface Synthesizer) and inspect (Source Inspector plus the Interface Synthesizer support query). Role identifiers are local to this ob; the complete catalogue with accepted interfaces is returned by listDelegateRoles.'
            enum:
                - invoke
                - synthesize
                - inspect
            type: string
        DelegateMigrationEntry:
            additionalProperties: false
            description: One legacy registry row and its reviewed disposition. Preview emits every row as unresolved; the operator sets convert (with the recovered interface value and explicit roles) or exclude, each with a review explanation. Archive names discarded legacy fields (JSON Pointer paths within the row) that have no safe mapping.
            properties:
                archive:
                    description: JSON Pointer paths of legacy fields discarded with explicit acknowledgment; they remain in the original backup.
                    items:
                        type: string
                    type: array
                disposition:
                    enum:
                        - unresolved
                        - convert
                        - exclude
                    type: string
                index:
                    description: Original row position; conversion preserves relative order.
                    minimum: 0
                    type: integer
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                    description: The explicitly recovered provider interface value to enroll (convert only).
                original:
                    description: The exact legacy row, retained for review and backup.
                    type: object
                providerReview:
                    description: Required when the legacy provider pin is missing or no longer matches the recovered interface.
                    type: string
                review:
                    description: Operator's explanation for the disposition (required to apply).
                    type: string
                roles:
                    $ref: '#/components/schemas/DelegateRoleIds'
                    description: Explicit roles to enroll for (convert only); suggestions are never activation.
            required:
                - index
                - original
                - disposition
            type: object
        DelegateMigrationPlan:
            additionalProperties: false
            description: A reviewable conversion plan for the retired location-based registry of one environment. It pins the exact source document (sourceHash), the target format and role catalogue, and every legacy row with a disposition. Plans may contain sensitive provider configuration; treat them as private files.
            properties:
                catalogue:
                    description: Identity of the role catalogue and policy the plan targets.
                    type: string
                entries:
                    items:
                        $ref: '#/components/schemas/DelegateMigrationEntry'
                    type: array
                environment:
                    description: Absolute path of the selected environment directory.
                    type: string
                format:
                    const: ob.delegate-migration@1
                    type: string
                sourceHash:
                    description: sha256 fingerprint of the exact legacy configuration bytes the plan was previewed from; apply refuses a changed source.
                    type: string
                targetFormat:
                    const: ob.delegate-registry@1
                    type: string
            required:
                - format
                - environment
                - sourceHash
                - targetFormat
                - catalogue
                - entries
            type: object
        DelegateMigrationReceipt:
            additionalProperties: false
            description: 'The recorded result of one applied conversion: the plan identity (also the name of the private backup directory and the argument of rollback), the source fingerprint, the committed state hash and registry revision, and the registration ID created for each original row (empty for excluded rows).'
            properties:
                commitHash:
                    type: string
                planHash:
                    type: string
                registrations:
                    items:
                        type: string
                    type: array
                revision:
                    minimum: 1
                    type: integer
                sourceHash:
                    type: string
            required:
                - planHash
                - sourceHash
                - commitHash
                - revision
                - registrations
            type: object
        DelegateRegistration:
            description: One manager-local enrollment of an interface value in one or more roles. The same interface may occur in several registrations, and several registrations may occupy the same role subject to that role's rules. Listing a registration reports recorded enrollment, not current health, trust, authorization, binding support, selection, or proof of implementation behavior.
            properties:
                id:
                    description: Opaque manager-assigned registration identifier. Unique and not reused within this manager's scope, including after removal. This is not the interface's identity, a locator, or an authorization credential.
                    minLength: 1
                    type: string
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                    description: The complete supplied OBI value retained for this registration. Preserve its declared values, including extensions and the schema, source, binding, and transform graphs; textual formatting is not significant. The manager must not replace it with a summary, locator, or silently refreshed remote document. Retaining this value does not freeze resources or services it references.
                rolePreferences:
                    $ref: '#/components/schemas/DelegateRolePreferences'
                    description: The complete explicit preference map for this registration. Empty when none are set. Listing must not synthesize explicit entries for roles using the implicit zero default.
                roles:
                    $ref: '#/components/schemas/DelegateRoleIds'
                    description: The complete recorded set of roles for this registration. Matching an additional role does not implicitly add it. Each role's configuration and selection remain independent; shared registration does not imply shared credentials, namespace, trust, or permission.
            required:
                - id
                - interface
                - roles
                - rolePreferences
            type: object
        DelegateRole:
            description: An application-defined responsibility for which interfaces may be registered. A role is local to the manager's scope; it is not an authorization role, an operation identifier, a binding specification, or a new OpenBindings Core concept.
            properties:
                acceptedInterfaces:
                    description: Alternative expected interfaces, carried as actual OBI values, not locations or interface-name assertions. Each must be a valid unbound OBI with at least one operation and no dependency entries. All operations in one alternative are the required capability set for that alternative. A candidate must correspond to and be schema-compatible with at least one complete alternative; it may carry additional operations. Array order is not a preference. These meanings are defined by this manager interface, not by Core. Expected bindings, dependency declarations, or operation names alone must not be used as proof that a candidate can safely be invoked.
                    items:
                        $ref: '#/components/schemas/OpenBindingsInterface'
                    minItems: 1
                    type: array
                description:
                    description: The responsibility's purpose and application-owned admission and use rules. Explain the effect of enrollment, multiple registrations, preferences (including whether and when they affect selection and how ties are handled), built-in implementations, provider changes, and absence or failure of an eligible delegate. This is human-readable documentation, not an executable policy language.
                    minLength: 1
                    type: string
                id:
                    description: Opaque role identifier, unique in this manager's scope. Compared exactly; no global role vocabulary or identifier format is prescribed. An existing identifier must not be reassigned to an unrelated responsibility.
                    minLength: 1
                    type: string
            required:
                - id
                - description
                - acceptedInterfaces
            type: object
        DelegateRoleIds:
            description: A nonempty set of role identifiers, carried as an array. Entries must be distinct, with exact string equality; duplicates are invalid. Array order carries no meaning or priority. Each role is selected explicitly by the caller; matching an unrequested role does not enroll the interface for it.
            items:
                minLength: 1
                type: string
            minItems: 1
            type: array
        DelegateRolePreferences:
            additionalProperties:
                type: number
            description: Explicit preferences keyed by exact enrolled role ID. Every key must belong to this registration's roles; an unlisted role is invalid, not an implicit enrollment. Missing entries have effective preference zero. Values are finite JSON numbers, preserved without silent rounding; larger values express stronger preference between registrations in the same role and manager scope. Equal values express no ordering. Magnitude is not a weight, probability, permission, mandatory failover order, or comparison across roles. The application's documented role policy determines how preference affects use. An explicitly supplied zero must remain an explicit entry until changed, cleared, or its role membership or registration is removed. It is distinct as stored data from an absent entry, but has the same effective preference. These are not preferences on the carried OBI's bindings.
            type: object
        DemoInput:
            additionalProperties: false
            properties:
                grpcPort:
                    description: gRPC server port.
                    type: integer
                httpPort:
                    description: HTTP server port.
                    type: integer
            type: object
        DetachOperationInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any identifier.
                    type: string
            required:
                - interface
                - operation
            type: object
        DiffReport:
            additionalProperties: false
            description: The differences between two interfaces (or an interface and what its sources produce). Empty operations, metadata, and drift means they are identical.
            properties:
                drift:
                    items:
                        $ref: '#/components/schemas/DriftEntry'
                    type: array
                metadata:
                    items:
                        $ref: '#/components/schemas/MetadataDiff'
                    type: array
                operations:
                    items:
                        $ref: '#/components/schemas/OperationDiff'
                    type: array
                warnings:
                    items:
                        type: string
                    type: array
            type: object
        DriftEntry:
            additionalProperties: false
            description: One operation key produced by multiple sources with differing schemas.
            properties:
                details:
                    items:
                        type: string
                    type: array
                operation:
                    type: string
                sources:
                    items:
                        $ref: '#/components/schemas/DriftSource'
                    type: array
            required:
                - operation
                - sources
            type: object
        DriftSource:
            additionalProperties: false
            properties:
                bindingSpec:
                    type: string
                key:
                    type: string
            required:
                - key
            type: object
        EnvironmentStatus:
            additionalProperties: false
            properties:
                contextCount:
                    description: Number of contexts in the user's context store (user-scoped, not per-environment).
                    type: integer
                delegateCount:
                    description: Number of registered delegates in this environment.
                    type: integer
                environmentPath:
                    description: Path to the .openbindings/ directory.
                    type: string
                environmentType:
                    description: Local or global environment.
                    type: string
            required:
                - environmentType
                - environmentPath
            type: object
        ErrorResponse:
            additionalProperties: false
            properties:
                code:
                    description: Stable machine-readable error code.
                    enum:
                        - codegen_failed
                        - comparison_failed
                        - context_store_failed
                        - delegate_resolution_failed
                        - edit_failed
                        - environment_failed
                        - initialization_failed
                        - inspection_failed
                        - internal_error
                        - invalid_host
                        - invalid_request
                        - invalid_upstream
                        - list_failed
                        - merge_failed
                        - not_found
                        - origin_forbidden
                        - preference_failed
                        - preflight_failed
                        - pull_failed
                        - registration_failed
                        - registry_unavailable
                        - relative_source_reference
                        - request_too_large
                        - resolution_failed
                        - resolution_forbidden
                        - source_exists
                        - source_failed
                        - status_failed
                        - synthesis_failed
                        - unauthorized
                        - unknown_capability
                        - unregistration_failed
                        - unsupported_language
                        - unsupported_media_type
                        - upgrade_required
                    type: string
                detail:
                    description: Optional diagnostic detail.
                    type: string
                error:
                    description: Human-readable error message.
                    type: string
            required:
                - error
                - code
            type: object
        GetDelegateRequirementsInput:
            additionalProperties: false
            properties:
                capability:
                    $ref: '#/components/schemas/DelegateCapability'
                    description: Role identifier (invoke, synthesize or inspect).
            required:
                - capability
            type: object
        InitializeEnvironmentInput:
            additionalProperties: false
            properties:
                global:
                    description: Initialize the global environment (the openbindings directory under the user config dir) instead of a local .openbindings/ directory.
                    type: boolean
            type: object
        InspectSourceInput:
            additionalProperties: false
            properties:
                source:
                    $ref: '#/components/schemas/Source'
            required:
                - source
            type: object
        InspectionLimitation:
            description: Machine-readable evidence explaining why a source inspection is not exhaustive.
            properties:
                code:
                    description: Stable namespaced reason code.
                    pattern: ^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)+$
                    type: string
                details:
                    additionalProperties: true
                    description: Optional implementation- or family-specific structured evidence.
                    type: object
                message:
                    description: Human-readable explanation of what may be missing and why.
                    minLength: 1
                    type: string
            required:
                - code
                - message
            type: object
        InterfaceInput:
            additionalProperties: false
            description: Wraps the interface document an operation acts on.
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
            required:
                - interface
            type: object
        InterfaceStatus:
            additionalProperties: false
            description: 'An interface''s read-only status against its sources: per-source sync state plus the source-owned vs hand-authored breakdown of its operations and bindings.'
            properties:
                bindings:
                    $ref: '#/components/schemas/ProvenanceKeys'
                dependencies:
                    $ref: '#/components/schemas/ProvenanceKeys'
                    description: 'Consumption points the document declares, split by provenance. A dependency is the opposite relationship to a binding: a realization this document CONSUMES rather than provides.'
                name:
                    type: string
                obiVersion:
                    description: The interface's declared OpenBindings version.
                    type: string
                operations:
                    $ref: '#/components/schemas/ProvenanceKeys'
                sources:
                    items:
                        $ref: '#/components/schemas/SourceStatus'
                    type: array
                version:
                    type: string
            required:
                - obiVersion
                - sources
                - operations
                - bindings
                - dependencies
            type: object
        InterfaceStatusInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
            required:
                - interface
            type: object
        InvocationError:
            additionalProperties: false
            description: Minimal unsuccessful-completion record carried by an `error` output frame. The frame kind is the portable failure signal. Only codes named by a rule of this interface, its operation-invoker peer, or the governing binding specification have portable semantics; other strings are open extension or implementation identifiers. Codes defined by either invocation interface are reserved to their defined meanings and MUST NOT be redefined by a binding or implementation. Other governed codes SHOULD use collision-resistant identifiers. ERR_EXECUTION_FAILED is the generic fallback when no more specific governed meaning exists; it means only that the interaction completed unsuccessfully, and carries no protocol category, blame, retryability, side-effect, authentication, authorization, or availability semantics.
            properties:
                code:
                    description: Machine-readable error code. This interface owns CONTEXT_REQUIRED, ERR_CANCELLED, ERR_FRAME_PROTOCOL, ERR_TRANSPORT_CLOSED, and ERR_EXECUTION_FAILED.
                    minLength: 1
                    type: string
                data:
                    description: 'Optional portable JSON data associated with the unsuccessful completion. A rule defining `code` may define its structure and semantics; otherwise, the governing binding specification may use it to preserve an opaque application-authored failure value. For CONTEXT_REQUIRED, this is a ContextRequiredDetails object. Presence is significant: an absent member means no portable associated value, while an explicit null is a present JSON null value. Statuses, headers, trailers, envelopes, raw debugging bytes, exception prose, stacks, and implementation evidence do not belong here unless they are themselves application data under an explicit governing rule.'
            required:
                - code
            type: object
        ListBindingsInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: Scope the listing to a single operation's bindings.
                    type: string
            required:
                - interface
            type: object
        ListDelegatesInput:
            additionalProperties: false
            properties:
                role:
                    description: Optional exact role identifier by which to filter registrations. Omit to list all registrations.
                    minLength: 1
                    type: string
            type: object
        ListOperationAliasesInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: Scope the satisfaction map to a single operation.
                    type: string
            required:
                - interface
            type: object
        ListOperationsInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                tag:
                    description: Filter operations by tag.
                    type: string
            required:
                - interface
            type: object
        MergeEntry:
            additionalProperties: false
            description: One operation-level change in a merge, and whether it was applied.
            properties:
                action:
                    description: The merge action for this entry (e.g. add, update, conflict).
                    type: string
                applied:
                    description: Whether this change was applied.
                    type: boolean
                details:
                    items:
                        type: string
                    type: array
                operation:
                    description: The operation key the change concerns.
                    type: string
            required:
                - operation
                - action
                - applied
            type: object
        MergeInterfacesInput:
            additionalProperties: false
            properties:
                excludeOperations:
                    description: Exclude these operations from the merge.
                    items:
                        type: string
                    type: array
                fromSources:
                    description: Derive the source side from the target's own binding sources.
                    type: boolean
                noBindings:
                    description: Don't graft bindings (operations and their referenced sources still come).
                    type: boolean
                noSources:
                    description: Don't graft source entries (operations and bindings still come).
                    type: boolean
                only:
                    description: Scope to a specific source key (requires fromSources).
                    type: string
                operations:
                    description: Only merge these operations.
                    items:
                        type: string
                    type: array
                opsOnly:
                    description: Graft operations only (no bindings or source entries) — the adopt-keys satisfaction strategy.
                    type: boolean
                source:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                target:
                    $ref: '#/components/schemas/OpenBindingsInterface'
            required:
                - target
            type: object
        MergeResult:
            additionalProperties: false
            properties:
                applied:
                    description: Number of changes applied.
                    type: integer
                dryRun:
                    description: Whether this was a preview run (changes reported, not applied).
                    type: boolean
                entries:
                    items:
                        $ref: '#/components/schemas/MergeEntry'
                    type: array
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                skipped:
                    description: Number of changes skipped.
                    type: integer
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - interface
            type: object
        MetadataDiff:
            additionalProperties: false
            properties:
                baseline:
                    type: string
                compared:
                    type: string
                field:
                    type: string
            required:
                - field
            type: object
        NewInterfaceInput:
            additionalProperties: false
            properties:
                description:
                    type: string
                name:
                    type: string
                openbindings:
                    description: Target OpenBindings spec version; defaults to the tool's max tested version.
                    type: string
                version:
                    type: string
            type: object
        OpenBindingsInterface:
            additionalProperties: true
            description: A valid OpenBindings interface document.
            type: object
        Operation:
            additionalProperties: true
            description: An operation definition as it would appear in an interface.
            properties:
                deprecated:
                    type: boolean
                description:
                    type: string
                input: {}
                output: {}
                tags:
                    items:
                        type: string
                    type: array
            type: object
        OperationAliasEntry:
            additionalProperties: false
            description: An operation and the interface operations it corresponds to via aliases.
            properties:
                aliases:
                    items:
                        type: string
                    type: array
                key:
                    type: string
            required:
                - key
                - aliases
            type: object
        OperationDiff:
            additionalProperties: false
            properties:
                details:
                    description: What specifically changed.
                    items:
                        type: string
                    type: array
                operation:
                    type: string
                status:
                    enum:
                        - added
                        - removed
                        - changed
                    type: string
            required:
                - operation
                - status
            type: object
        OperationInvocationInput:
            additionalProperties: false
            description: 'Initial payload carried by invokeOperation''s open frame: the interface to act on and which operation (or specific binding) to invoke, plus context.'
            oneOf:
                - required:
                    - operation
                - required:
                    - binding
            properties:
                binding:
                    description: Binding key to invoke; the operation is derived from it. Mutually exclusive with operation.
                    type: string
                context:
                    $ref: '#/components/schemas/BindingContext'
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: Operation key to invoke. A binding is selected automatically.
                    type: string
            required:
                - interface
            type: object
        OperationInvokerInputFrame:
            description: 'One frame from the caller into invokeOperation. Same shape as the binding-invoker input stream, with the open frame carrying an OperationInvocationInput: exactly one `open` first, then zero or more `input` frames, then exactly one `close`.'
            discriminator:
                propertyName: kind
            oneOf:
                - additionalProperties: false
                  description: Open the invocation. MUST be the first frame on the input stream.
                  properties:
                    input:
                        $ref: '#/components/schemas/OperationInvocationInput'
                    kind:
                        const: open
                  required:
                    - kind
                    - input
                  title: open
                  type: object
                - additionalProperties: false
                  description: Write one input value to the operation. Validated against the operation's input schema.
                  properties:
                    kind:
                        const: input
                    value:
                        description: One input value.
                  required:
                    - kind
                    - value
                  title: input
                  type: object
                - additionalProperties: false
                  description: Caller signals no more input frames will be sent. Idempotent.
                  properties:
                    kind:
                        const: close
                  required:
                    - kind
                  title: close
                  type: object
        OperationInvokerOutputFrame:
            description: 'One frame from invokeOperation back to the caller. Same shape as the binding-invoker output stream: zero or more `output`/`input_closed` frames, then exactly one terminal `complete` or `error`. Each output is validated against the operation''s output schema.'
            discriminator:
                propertyName: kind
            oneOf:
                - additionalProperties: false
                  description: One output value from the operation.
                  properties:
                    kind:
                        const: output
                    value:
                        description: One output value.
                  required:
                    - kind
                    - value
                  title: output
                  type: object
                - additionalProperties: false
                  description: The operation has closed the input side from its end. Subsequent caller input frames are ignored. Outputs may still flow.
                  properties:
                    kind:
                        const: input_closed
                  required:
                    - kind
                  title: input_closed
                  type: object
                - additionalProperties: false
                  description: 'Terminal: the operation completed normally. MUST be the last frame.'
                  properties:
                    kind:
                        const: complete
                  required:
                    - kind
                  title: complete
                  type: object
                - additionalProperties: false
                  description: 'Terminal: the operation failed. MUST be the last frame. Carries a structured InvocationError.'
                  properties:
                    error:
                        $ref: '#/components/schemas/InvocationError'
                    kind:
                        const: error
                  required:
                    - kind
                    - error
                  title: error
                  type: object
        OperationListEntry:
            additionalProperties: false
            description: An operation from the interface's operations map, with its key and the bindings that realize it.
            properties:
                bindings:
                    description: Keys of the binding entries that realize this operation.
                    items:
                        type: string
                    type: array
                key:
                    description: The operation's key in the interface's operations map.
                    type: string
                operation:
                    $ref: '#/components/schemas/Operation'
            required:
                - key
                - operation
            type: object
        ProvenanceKeys:
            additionalProperties: false
            description: 'Keys split by provenance: source-owned (derived from a source by pullSource) vs hand-authored.'
            properties:
                handAuthored:
                    items:
                        type: string
                    type: array
                sourceOwned:
                    items:
                        type: string
                    type: array
            type: object
        PullSourceInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                sourceKeys:
                    description: Sources to pull; empty means all registered sources.
                    items:
                        type: string
                    type: array
            required:
                - interface
            type: object
        RegisterDelegateInput:
            additionalProperties: false
            properties:
                id:
                    description: When supplied, the existing registration to re-enroll with the supplied interface and complete role set. Omit for a new registration. Passing an unknown id fails.
                    minLength: 1
                    type: string
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                    description: The actual provider OBI value. It may come from memory, a file, synthesis, another operation, or caller-managed retrieval; no published address is required. The provider's own dependencies, if present, are not automatically satisfied by registration.
                rolePreferences:
                    $ref: '#/components/schemas/DelegateRolePreferences'
                    description: Optional complete explicit preference map, committed atomically with enrollment. An empty object clears all explicit preferences. If omitted, a new registration has none; re-enrollment preserves current preferences for retained roles only.
                roles:
                    $ref: '#/components/schemas/DelegateRoleIds'
            required:
                - interface
                - roles
            type: object
        RemoveOperationAliasInput:
            additionalProperties: false
            properties:
                aliases:
                    description: Satisfaction alias(es) to remove.
                    items:
                        type: string
                    minItems: 1
                    type: array
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any existing identifier.
                    type: string
            required:
                - interface
                - operation
                - aliases
            type: object
        RemoveOperationInput:
            additionalProperties: false
            properties:
                force:
                    description: Remove source-owned operations without warning.
                    type: boolean
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                keys:
                    description: Operation keys to remove.
                    items:
                        type: string
                    minItems: 1
                    type: array
            required:
                - interface
                - keys
            type: object
        RenameOperationInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                newKey:
                    type: string
                oldKey:
                    type: string
            required:
                - interface
                - oldKey
                - newKey
            type: object
        ReportCompatibilityInput:
            additionalProperties: false
            properties:
                candidate:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                target:
                    $ref: '#/components/schemas/OpenBindingsInterface'
            required:
                - target
                - candidate
            type: object
        ResolveInterfaceInput:
            additionalProperties: false
            properties:
                address:
                    description: Base URL or host to resolve from (e.g. https://api.example.com or localhost:8080).
                    type: string
            required:
                - address
            type: object
        ResolveInterfaceOutput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                resolvedUrl:
                    description: The URL the interface document (or the source spec it was synthesized from) was ultimately fetched from.
                    type: string
                synthesizedFrom:
                    description: The binding-format token the interface was synthesized from (e.g. openapi@3.1) when the target was not already an OBI; absent for native OBIs.
                    type: string
            required:
                - interface
            type: object
        RoleResolutionInput:
            additionalProperties: false
            allOf:
                - else:
                    properties:
                        path:
                            enum:
                                - ranked
                                - native-first
                  if:
                    required:
                        - registrationId
                  then:
                    properties:
                        path:
                            const: explicit
                - if:
                    not:
                        required:
                            - registrationId
                    properties:
                        role:
                            enum:
                                - synthesize
                                - inspect
                  then:
                    properties:
                        path:
                            const: native-first
            properties:
                bindingSpec:
                    description: Exact opaque binding specification identifier.
                    minLength: 1
                    type: string
                path:
                    description: Omit for the role default, or explicit with registrationId. Ranked is only available for invoke.
                    enum:
                        - ranked
                        - native-first
                        - explicit
                    type: string
                registrationId:
                    description: Exact enrolled registration ID, not a display name or locator. No fallback.
                    minLength: 1
                    type: string
                role:
                    enum:
                        - invoke
                        - synthesize
                        - inspect
                    type: string
            required:
                - role
                - bindingSpec
            type: object
        RoleResolutionOutput:
            additionalProperties: false
            properties:
                available:
                    description: False only for a completed assessment with no supported provider; failures are errors.
                    type: boolean
                bindingSpec:
                    type: string
                builtin:
                    description: True only for the built-in provider; built-ins have no registration ID.
                    type: boolean
                path:
                    enum:
                        - ranked
                        - native-first
                        - explicit
                    type: string
                registrationId:
                    description: Selected registration, present only for an available external provider.
                    minLength: 1
                    type: string
                role:
                    enum:
                        - invoke
                        - synthesize
                        - inspect
                    type: string
            required:
                - role
                - bindingSpec
                - path
                - available
                - builtin
            type: object
        RollbackDelegateMigrationInput:
            additionalProperties: false
            properties:
                confirmQuiesced:
                    const: true
                    type: boolean
                planHash:
                    description: The plan identity from the migration receipt (sha256:...).
                    minLength: 1
                    type: string
            required:
                - planHash
                - confirmQuiesced
            type: object
        ServerInfo:
            additionalProperties: false
            properties:
                port:
                    type: integer
                url:
                    description: Base URL the server is listening on.
                    type: string
            type: object
        SetContextInput:
            additionalProperties: false
            properties:
                key:
                    description: Context store key.
                    type: string
                value:
                    $ref: '#/components/schemas/Context'
            required:
                - key
                - value
            type: object
        SetDelegateBindingPreferenceInput:
            additionalProperties: false
            description: 'ob-native override input: a preference that applies to one registration, one role and one exact binding-specification identifier. Overrides are stored separately from the shared rolePreferences map and cannot enroll a role.'
            properties:
                bindingSpec:
                    description: Exact binding-specification identifier the override applies to.
                    minLength: 1
                    type: string
                id:
                    description: Existing manager-local registration identifier.
                    minLength: 1
                    type: string
                preference:
                    description: Finite JSON number to set as the override, or null to clear it. Omission is invalid.
                    oneOf:
                        - type: number
                        - type: "null"
                role:
                    description: Exact role ID already recorded on this registration.
                    minLength: 1
                    type: string
            required:
                - id
                - role
                - bindingSpec
                - preference
            type: object
        SetDelegatePreferenceInput:
            additionalProperties: false
            properties:
                id:
                    description: Existing manager-local registration identifier.
                    minLength: 1
                    type: string
                preference:
                    description: Finite JSON number to set as the explicit role preference, or null to clear it. Omission is invalid; zero is a stored preference, not a clear request.
                    oneOf:
                        - type: number
                        - type: "null"
                role:
                    description: Exact role ID already recorded on this registration.
                    minLength: 1
                    type: string
            required:
                - id
                - role
                - preference
            type: object
        SetMetadataInput:
            additionalProperties: false
            properties:
                description:
                    type: string
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                name:
                    type: string
                version:
                    type: string
            required:
                - interface
            type: object
        SetOperationCodegenNameInput:
            additionalProperties: false
            properties:
                clear:
                    description: Remove the codegen-name override.
                    type: boolean
                codegenName:
                    description: The symbol name 'ob codegen' should emit for this operation. Omit (or send empty) with clear=true to remove the override.
                    type: string
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any identifier.
                    type: string
            required:
                - interface
                - operation
            type: object
        SetOperationInput:
            additionalProperties: false
            properties:
                addTags:
                    items:
                        type: string
                    type: array
                deprecated:
                    type: boolean
                description:
                    type: string
                idempotent:
                    type: boolean
                input:
                    description: Replacement JSON Schema for the operation's input.
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any identifier.
                    type: string
                output:
                    description: Replacement JSON Schema for the operation's output.
                own:
                    description: Take ownership of a source-owned operation (detach) before editing.
                    type: boolean
                removeTags:
                    items:
                        type: string
                    type: array
            required:
                - interface
                - operation
            type: object
        SetOperationOutputSchemaInput:
            additionalProperties: false
            properties:
                clear:
                    description: Remove the output-schema election.
                    type: boolean
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any identifier.
                    type: string
                outputSchema:
                    description: The real output schema to elect. Omit with clear=true to remove the election.
                    type: object
            required:
                - interface
                - operation
            type: object
        SoftwareIdentity:
            additionalProperties: true
            description: Identity and metadata for a piece of software.
            properties:
                description:
                    description: Brief description.
                    type: string
                homepage:
                    description: Documentation URL.
                    type: string
                maintainer:
                    description: Author or organization.
                    type: string
                name:
                    description: Human-readable display name.
                    type: string
                repository:
                    description: Source code URL.
                    type: string
                version:
                    description: Software version.
                    type: string
            required:
                - name
            type: object
        Source:
            additionalProperties: true
            anyOf:
                - required:
                    - location
                - required:
                    - content
            description: A binding source (binding-specification identifier plus location or content), as an OpenBindings document carries it. Open to extension fields so a document's source entry forwards verbatim.
            properties:
                bindingSpec:
                    description: Binding specification identifier governing this source.
                    type: string
                content:
                    description: Embedded source-artifact representation, per its binding specification.
                description:
                    description: Human-readable description for this source.
                    type: string
                location:
                    description: Absolute address of the source, per its binding specification (core OBI-D-05).
                    type: string
            required:
                - bindingSpec
            type: object
        SourceInspection:
            allOf:
                - if:
                    properties:
                        exhaustive:
                            const: false
                    required:
                        - exhaustive
                  then:
                    required:
                        - limitation
            description: Inspection result for a binding source artifact. Its inventory boundary is the targets admitted by the governing binding specification, not every interaction in the upstream artifact.
            properties:
                exhaustive:
                    description: True when targets is the complete list of targets admitted by the governing binding specification. False means more admitted targets may exist and requires limitation evidence.
                    type: boolean
                limitation:
                    $ref: '#/components/schemas/InspectionLimitation'
                targets:
                    items:
                        $ref: '#/components/schemas/BindableTarget'
                    type: array
            required:
                - targets
                - exhaustive
            type: object
        SourceKeyInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                key:
                    description: Source key.
                    type: string
            required:
                - interface
                - key
            type: object
        SourceListEntry:
            additionalProperties: false
            description: A source from the interface's sources map, with its key.
            properties:
                key:
                    description: The source's key in the interface's sources map.
                    type: string
                source:
                    $ref: '#/components/schemas/Source'
            required:
                - key
                - source
            type: object
        SourcePullOutput:
            additionalProperties: false
            description: 'The result of a `source pull`: the resulting interface document plus the change log — the source-owned operations and bindings added, updated, or pruned, the sources pulled and skipped, and any warnings.'
            properties:
                bindingsAdded:
                    items:
                        type: string
                    type: array
                bindingsPruned:
                    items:
                        type: string
                    type: array
                bindingsUpdated:
                    items:
                        type: string
                    type: array
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operationsAdded:
                    items:
                        type: string
                    type: array
                operationsPruned:
                    items:
                        type: string
                    type: array
                operationsUpdated:
                    items:
                        type: string
                    type: array
                skipped:
                    description: Source keys skipped (hand-authored or unreadable).
                    items:
                        type: string
                    type: array
                sources:
                    description: Source keys pulled.
                    items:
                        type: string
                    type: array
                warnings:
                    items:
                        type: string
                    type: array
            required:
                - interface
            type: object
        SourceStatus:
            additionalProperties: false
            description: 'Drift status of one source on an interface: what `ob source pull` would add/update/remove, plus custodial drift on hand-authored bindings whose target is gone.'
            properties:
                bindingSpec:
                    type: string
                bindingsAdded:
                    items:
                        type: string
                    type: array
                bindingsRemoved:
                    items:
                        type: string
                    type: array
                bindingsUpdated:
                    items:
                        type: string
                    type: array
                custodial:
                    description: Hand-authored bindings whose source target no longer exists.
                    items:
                        type: string
                    type: array
                error:
                    type: string
                inSync:
                    description: Whether the source would change nothing and has no custodial drift.
                    type: boolean
                key:
                    type: string
                lastSynced:
                    type: string
                obVersion:
                    type: string
                operationsAdded:
                    items:
                        type: string
                    type: array
                operationsRemoved:
                    items:
                        type: string
                    type: array
                operationsUpdated:
                    items:
                        type: string
                    type: array
                ref:
                    type: string
                resolve:
                    type: string
                tracked:
                    description: Whether ob tracks this source via x-ob provenance metadata (written by addSource or synthesizeInterface). Untracked sources are hand-authored; pull skips them.
                    type: boolean
            required:
                - key
                - bindingSpec
                - inSync
                - tracked
            type: object
        StartMCPServerInput:
            additionalProperties: false
            properties:
                name:
                    description: MCP server name.
                    type: string
                port:
                    description: HTTP port when transport is http (default 8080).
                    type: integer
                transport:
                    description: Transport (default stdio).
                    enum:
                        - stdio
                        - http
                    type: string
                url:
                    description: Interface URL to expose as an MCP server (an OBI, a well-known discovery base, or a raw binding spec). Compose an aggregate OBI to bridge several services.
                    type: string
            required:
                - url
            type: object
        StartServerInput:
            additionalProperties: false
            properties:
                allowOrigins:
                    description: Allowed CORS origins.
                    items:
                        type: string
                    type: array
                port:
                    description: Port to listen on (default 20290).
                    type: integer
                tls:
                    description: Also serve HTTPS using a locally generated CA without modifying system trust.
                    type: boolean
                token:
                    description: Pre-shared session token.
                    type: string
                trustLocalCA:
                    description: Install the locally generated HTTPS CA into system trust; implies tls and may require administrator approval.
                    type: boolean
            type: object
        SynthesizeInterfaceInput:
            additionalProperties: false
            properties:
                description:
                    description: Interface description override.
                    type: string
                name:
                    description: Interface name override.
                    type: string
                openbindingsVersion:
                    description: Target OpenBindings spec version.
                    type: string
                sources:
                    description: Binding sources to synthesize from.
                    items:
                        $ref: '#/components/schemas/SynthesizeInterfaceSource'
                    type: array
                version:
                    description: Interface contract version override.
                    type: string
            type: object
        SynthesizeInterfaceSource:
            additionalProperties: false
            anyOf:
                - required:
                    - location
                - required:
                    - content
            description: A binding source to synthesize an interface from.
            properties:
                bindingSpec:
                    description: Binding specification identifier governing this source.
                    type: string
                content:
                    description: Content provided directly.
                description:
                    description: Human-readable description for this source.
                    type: string
                embed:
                    description: If true, embed content inline in the output.
                    type: boolean
                location:
                    description: Location to fetch content from (path or URL).
                    type: string
                name:
                    description: Key name for this binding source in the output.
                    type: string
                outputLocation:
                    description: Location to reference in the output.
                    type: string
            required:
                - bindingSpec
            type: object
        UnbindOperationInput:
            additionalProperties: false
            description: Select exactly one binding either by its exact binding key, or by the operation and source pair used by ob's conventional binding-key form. Supplying neither selector, an incomplete pair, or both selectors is refused.
            properties:
                binding:
                    description: Exact binding key to remove. Do not also supply operation or source.
                    type: string
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                operation:
                    description: The operation's key or any identifier. Used with source when binding is absent.
                    type: string
                source:
                    description: Source key whose binding to remove. Used with operation when binding is absent.
                    type: string
            required:
                - interface
            type: object
        UnregisterDelegateInput:
            additionalProperties: false
            properties:
                id:
                    description: The manager-local registration identifier to remove.
                    minLength: 1
                    type: string
            required:
                - id
            type: object
        ValidateInterfaceInput:
            additionalProperties: false
            properties:
                interface:
                    $ref: '#/components/schemas/OpenBindingsInterface'
                strict:
                    description: Additionally reject unknown (non-x-) fields. A spec version newer than the tool supports is refused in every mode.
                    type: boolean
            required:
                - interface
            type: object
        ValidationReport:
            additionalProperties: true
            properties:
                problems:
                    items:
                        type: string
                    type: array
                valid:
                    type: boolean
                version:
                    description: The spec version the document declares.
                    type: string
            required:
                - valid
            type: object
    securitySchemes:
        bearerAuth:
            bearerFormat: opaque
            scheme: bearer
            type: http
        oauth2Auth:
            flows:
                authorizationCode:
                    authorizationUrl: ${OB_SERVER_URL}/oauth/authorize
                    scopes: {}
                    tokenUrl: ${OB_SERVER_URL}/oauth/token
            type: oauth2
security:
    - oauth2Auth: []
    - bearerAuth: []
