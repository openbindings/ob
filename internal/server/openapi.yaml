openapi: 3.1.0
info:
    description: A local, document-oriented API for inspecting, authoring, invoking, and operating OpenBindings interfaces. JSON request bodies and individual WebSocket frames are limited to 10 MiB.
    title: ob start API
    version: 0.1.0
servers:
    - description: This ob start instance.
      url: ${OB_SERVER_URL}
paths:
    /.well-known/openbindings:
        get:
            operationId: getOBI
            responses:
                "200":
                    content:
                        application/vnd.openbindings+json:
                            schema:
                                $ref: '#/components/schemas/OpenBindingsInterface'
                    description: Successful response.
            security: []
            summary: Return the interface implemented by this server.
    /asyncapi.yaml:
        get:
            operationId: getAsyncAPISpec
            responses:
                "200":
                    content:
                        text/yaml:
                            schema:
                                type: string
                    description: Successful response.
            security: []
            summary: Return the WebSocket frame API document.
    /binding-specs:
        get:
            description: Return an advisory glance at the native binding specifications this instance can name, for display, documentation, and pickers. Presence is a support warrant and absence carries no information; support decisions use checkBindingSpecs. One operation answers the listBindingSpecs slot of every interface that has one.
            operationId: listBindingSpecs
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/BindingSpecInfo'
                                type: array
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Return an advisory glance at the native binding specifications this instance can name, for display, documentation, and pickers.
    /binding-specs/check:
        post:
            description: Authoritatively determine support for exact, opaque binding-specification identifier tokens. This is the only operation a consumer may use to make a support decision such as source acceptance, refusal, or delegation. The result contains one verdict per unique input token in first-occurrence order. supported is always a strict boolean; true warrants that this implementation implements the specification the exact string denotes, as published. The result is deterministic for this implementation version and the operation is side-effect free. Internal patterns never extend the warranted set or match future revisions. Future optional verdict fields may annotate a verdict but never qualify supported.
            operationId: checkBindingSpecs
            requestBody:
                content:
                    application/json:
                        schema:
                            additionalProperties: false
                            properties:
                                bindingSpecs:
                                    description: Exact, opaque binding-specification identifier tokens to check. The array may be empty.
                                    items:
                                        type: string
                                    type: array
                            required:
                                - bindingSpecs
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/BindingSpecVerdict'
                                type: array
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Authoritatively determine support for exact, opaque binding-specification identifier tokens.
    /bindings/preflight:
        post:
            description: 'Preflight a binding: tell it that an invocation of this selection may follow and let it report the context requirements it can already identify from the source and the supplied context. Returns ContextRequiredDetails in the same shape a CONTEXT_REQUIRED challenge carries, or null. Advisory: it may omit requirements, null is always conformant, and invokeBinding''s live CONTEXT_REQUIRED challenge remains authoritative; invocation never requires a prior preflight. Context supplied here is used for this call alone and narrows the result to what it leaves unsatisfied. Preflight never dispatches the requested operation, consumes its input, emits its outputs, or spends an approval for it; what else a binding does to answer is its governing binding specification''s to require. An unsuccessful completion means the binding could not answer and carries no prediction.'
            operationId: preflightBinding
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BindingInvocationInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ContextRequiredDetails'
                                    - type: "null"
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: 'Preflight a binding: tell it that an invocation of this selection may follow and let it report the context requirements it can already identify from the source and the supplied context.'
    /contexts:
        get:
            description: 'List metadata-only summaries for stored contexts; never returns stored context values. Completes the context surface with listing and inspection: the generic document-store substrate these contexts are stored under (satisfied by getContext/setContext/removeContext) standardizes only opaque get/set/delete, so this management view is ob''s own.'
            operationId: listContexts
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ContextSummary'
                                type: array
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: List metadata-only summaries for stored contexts; never returns stored context values.
    /contexts/{url}:
        delete:
            description: Remove the stored context for a key. Deleting an absent key succeeds.
            operationId: removeContext
            parameters:
                - in: path
                  name: url
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: The operation completed successfully; there is no response body.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Remove the stored context for a key.
        get:
            description: 'Get the stored context for a key. Returns the unified context payload (credentials, headers, cookies, environment, metadata in a single opaque map), or null when no context matches. Lookup on URL keys is hierarchical, like invocation-time matching: the exact key wins, then the store walks up the URL path to the most specific stored prefix. Exact keys behave as a plain document get, so the document-store alias holds.'
            operationId: getContext
            parameters:
                - in: path
                  name: url
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Context'
                                    - type: "null"
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Get the stored context for a key.
        put:
            description: Create or replace the context for a key. The supplied value fully replaces any existing context (full replacement, not partial update).
            operationId: setContext
            parameters:
                - in: path
                  name: url
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BindingContext'
                required: true
            responses:
                "204":
                    description: The operation completed successfully; there is no response body.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Create or replace the context for a key.
    /delegate-requirements/{capability}:
        get:
            description: Return the one accepted interface a delegate must correspond to for a role, as a convenience projection of listDelegateRoles; a role that accepts several alternatives is refused rather than reduced to its first entry. Correspondence is exact-key plus directional schema compatibility for the whole alternative.
            operationId: getDelegateRequirements
            parameters:
                - in: path
                  name: capability
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/vnd.openbindings+json:
                            schema:
                                $ref: '#/components/schemas/OpenBindingsInterface'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Return the one accepted interface a delegate must correspond to for a role, as a convenience projection of listDelegateRoles; a role that accepts several alternatives is refused rather than reduced to its first entry.
    /delegates:
        get:
            description: Return every registration of the active environment with its retained interface value, complete role set and explicit preference map; with role, only registrations enrolled in that exact role, records untrimmed. Built-in handling is not a registration and is not listed. A missing environment is an empty list; legacy, mixed, corrupt or unsupported registry state is an error rather than an empty inventory.
            operationId: listDelegates
            parameters:
                - description: Exact role identifier; keeps only registrations enrolled in it without trimming their records.
                  in: query
                  name: role
                  required: false
                  schema:
                    minLength: 1
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    delegates:
                                        items:
                                            $ref: '#/components/schemas/DelegateRegistration'
                                        type: array
                                required:
                                    - delegates
                                type: object
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Return every registration of the active environment with its retained interface value, complete role set and explicit preference map; with role, only registrations enrolled in that exact role, records untrimmed.
    /delegates/binding-preference:
        post:
            description: 'ob-native: set (number) or clear (null) a preference override scoped to one registration, one recorded role and one exact binding-specification identifier. When that identifier is requested in that role the override replaces the role preference; otherwise the role preference (else zero) applies. Overrides never change the shared rolePreferences map and cannot enroll a role. This is an OB operation, not part of the shared Delegate Manager interface.'
            operationId: setDelegateBindingPreference
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetDelegateBindingPreferenceInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: "null"
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: 'ob-native: set (number) or clear (null) a preference override scoped to one registration, one recorded role and one exact binding-specification identifier.'
    /delegates/preference:
        post:
            description: Set (number) or clear (null) the explicit preference of one existing registration in one of its recorded roles. Numbers are retained exactly; an explicit zero stays a stored entry until cleared. Everything else about the registration is unchanged. Higher orders eligible external registrations within the role; equal values keep registration order. ob's native binding-specification overrides are separate and unaffected.
            operationId: setDelegatePreference
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetDelegatePreferenceInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: "null"
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Set (number) or clear (null) the explicit preference of one existing registration in one of its recorded roles.
    /delegates/register:
        post:
            description: 'Enroll an interface value for every requested role under a fresh manager-issued ID, or with id replace an existing registration''s complete interface and role set. Every requested role must accept the whole document (exact key correspondence plus directional schema compatibility for one complete alternative); matching an unrequested role never enrolls it. The supplied document is retained exactly, extensions included, and no provider is fetched or invoked. rolePreferences, when supplied, is the complete explicit map (empty clears); when omitted a fresh registration stores {} and a replacement keeps entries for retained roles only. Interface, roles and preferences commit atomically under the environment lock; a rejection leaves no mutation, and a lost response after commit is uncertain completion, not rollback. This operation is not idempotent: a call without id allocates a new registration even for an identical document. ob accepts at most 1 MiB per interface and 256 registrations per environment.'
            operationId: registerDelegate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterDelegateInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegateRegistration'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Enroll an interface value for every requested role under a fresh manager-issued ID, or with id replace an existing registration's complete interface and role set.
    /delegates/resolve:
        post:
            description: Assess OB's live provider selection for a role and exact binding specification identifier. Invocation defaults to ranked selection; its native-first frame path can be requested. Synthesis and inspection use native-first. An explicit registration ID constrains assessment to that enrolled registration, without fallback. Negative support is available=false; invalid state or failed assessment is an error. No workload is invoked. This is a point-in-time diagnostic, not a reservation, authorization grant or shared Delegate Manager operation.
            operationId: resolveRoleDelegate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RoleResolutionInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RoleResolutionOutput'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Assess OB's live provider selection for a role and exact binding specification identifier.
    /delegates/roles:
        get:
            description: 'Return the complete catalogue of roles this ob accepts delegates for: invoke (Binding Invoker), synthesize (Interface Synthesizer) and inspect (Source Inspector with the Interface Synthesizer support query). Each role carries its purpose and use policy and its accepted interfaces as actual unbound OBI values. ob''s policy per role: admission records compatibility, not trust or activation; runtime requires an authoritative support verdict for the exact binding specification, an executable binding and existing recipient authorization; eligible external registrations are ordered by preference, ties keep registration order; ordinary operation and raw binding invocation rank externals against the built-in (built-in wins ties), while frame invocation, synthesis and inspection are native-first; no workload failover.'
            operationId: listDelegateRoles
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    roles:
                                        description: All advertised roles. Order is unspecified and has no selection semantics.
                                        items:
                                            $ref: '#/components/schemas/DelegateRole'
                                        type: array
                                required:
                                    - roles
                                type: object
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: 'Return the complete catalogue of roles this ob accepts delegates for: invoke (Binding Invoker), synthesize (Interface Synthesizer) and inspect (Source Inspector with the Interface Synthesizer support query).'
    /delegates/unregister:
        post:
            description: Ensure the registration is absent, removing all of its role memberships, preferences and native overrides together. An absent id succeeds. Removal stops new lookups from offering the record; it does not cancel in-flight invocations, revoke credentials or undo provider effects.
            operationId: unregisterDelegate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UnregisterDelegateInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: "null"
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Ensure the registration is absent, removing all of its role memberships, preferences and native overrides together.
    /describe:
        get:
