openapi: 3.1.0
info:
    description: A local, document-oriented API for inspecting, authoring, invoking, and operating OpenBindings interfaces. JSON request bodies and individual WebSocket frames are limited to 10 MiB.
    title: ob start API
    version: 0.1.0
servers:
    - description: This ob start instance.
      url: ${OB_SERVER_URL}
paths:
    /.well-known/openbindings:
        get:
            operationId: getOBI
            responses:
                "200":
                    content:
                        application/vnd.openbindings+json:
                            schema:
                                $ref: '#/components/schemas/OpenBindingsInterface'
                    description: Successful response.
            security: []
            summary: Return the interface implemented by this server.
    /asyncapi.yaml:
        get:
            operationId: getAsyncAPISpec
            responses:
                "200":
                    content:
                        text/yaml:
                            schema:
                                type: string
                    description: Successful response.
            security: []
            summary: Return the WebSocket frame API document.
    /binding-specs:
        get:
            description: List the binding specifications this instance can handle, by exact identifier. One operation answers the listBindingSpecs slot of every interface that has one, since the answer is the same regardless of which capability is asking.
            operationId: listBindingSpecs
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/BindingSpecInfo'
                                type: array
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: List the binding specifications this instance can handle, by exact identifier.
    /bindings/prepare:
        post:
            description: 'Preflight a binding: report the context it would require before invocation, without invoking it or causing side effects. Returns ContextRequiredDetails the runtime can resolve proactively, or null when requirements cannot be determined statically. Advisory; invokeBinding''s reactive CONTEXT_REQUIRED error is authoritative. When context is supplied, reports only the requirements still unsatisfied by it.'
            operationId: prepareBinding
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BindingInvocationInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/ContextRequiredDetails'
                                    - type: "null"
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: 'Preflight a binding: report the context it would require before invocation, without invoking it or causing side effects.'
    /contexts:
        get:
            description: 'List metadata-only summaries for stored contexts; never returns stored context values. Completes the context surface with listing and inspection: the generic document-store substrate these contexts are stored under (satisfied by getContext/setContext/removeContext) standardizes only opaque get/set/delete, so this management view is ob''s own.'
            operationId: listContexts
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/ContextSummary'
                                type: array
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: List metadata-only summaries for stored contexts; never returns stored context values.
    /contexts/{url}:
        delete:
            description: Remove the stored context for a key. Deleting an absent key succeeds.
            operationId: removeContext
            parameters:
                - in: path
                  name: url
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: The operation completed successfully; there is no response body.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Remove the stored context for a key.
        get:
            description: 'Get the stored context for a key. Returns the unified context payload (credentials, headers, cookies, environment, metadata in a single opaque map), or null when no context matches. Lookup on URL keys is hierarchical, like invocation-time matching: the exact key wins, then the store walks up the URL path to the most specific stored prefix. Exact keys behave as a plain document get, so the document-store alias holds.'
            operationId: getContext
            parameters:
                - in: path
                  name: url
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/Context'
                                    - type: "null"
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Get the stored context for a key.
        put:
            description: Create or replace the context for a key. The supplied value fully replaces any existing context (full replacement, not partial update).
            operationId: setContext
            parameters:
                - in: path
                  name: url
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BindingContext'
                required: true
            responses:
                "204":
                    description: The operation completed successfully; there is no response body.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Create or replace the context for a key.
    /delegate-requirements/{capability}:
        get:
            description: Return the exact operation subset a delegate must satisfy to provide an ob capability (invoke → listBindingSpecs + invokeBinding, synthesize → listBindingSpecs + synthesizeInterface, inspect → listBindingSpecs + inspectSource). Definitions are derived from immutable published interfaces bundled with this ob release. Correspondence is per operation, so unrelated operations from the same published interface are not imposed on a delegate.
            operationId: getDelegateRequirements
            parameters:
                - in: path
                  name: capability
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/vnd.openbindings+json:
                            schema:
                                $ref: '#/components/schemas/OpenBindingsInterface'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Return the exact operation subset a delegate must satisfy to provide an ob capability (invoke → listBindingSpecs + invokeBinding, synthesize → listBindingSpecs + synthesizeInterface, inspect → listBindingSpecs + inspectSource).
    /delegates:
        get:
            description: List every registered delegate — the self-delegate included — with the operations each carried when last resolved, the capabilities and formats ob derived for routing, and its selection preferences.
            operationId: listDelegates
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                additionalProperties: false
                                properties:
                                    delegates:
                                        description: The registered delegates.
                                        items:
                                            $ref: '#/components/schemas/DelegateSummary'
                                        type: array
                                required:
                                    - delegates
                                type: object
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: List every registered delegate — the self-delegate included — with the operations each carried when last resolved, the capabilities and formats ob derived for routing, and its selection preferences.
    /delegates/preference:
        post:
            description: Set or clear a delegate's selection preference (higher = more preferred; 0 is the baseline; negatives rank below it; null clears). Without an operation, sets the delegate-level default; with one, sets that operation's entry in the delegate's preference index. ob additionally accepts a binding-source format scope on an operation entry — how synthesis of one format can prefer one delegate while everything else prefers another. Preference governs the order resolveDelegate returns candidates in; routing applies OBI-T-09's selection semantics to delegates — ob's own narrowing, not a spec rule — with effective preference the per-operation value, else the delegate-level value, else 0. Returns the updated summary.
            operationId: setDelegatePreference
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetDelegatePreferenceInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegateSummary'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Set or clear a delegate's selection preference (higher = more preferred; 0 is the baseline; negatives rank below it; null clears).
    /delegates/register:
        post:
            description: 'Register a delegate — any referenceable OpenBindings interface (an exec: or http(s) location) that ob may route operations to. ob resolves the location to the delegate''s OBI and records a snapshot: the operation identifiers it carries (keys and aliases), a content digest pinning the resolved document, and what ob derives for its own routing — which of ob''s format capabilities the delegate satisfies (checked by conformance, not name-matching) and the formats it handles. Registration fails when the location cannot be resolved to an interface. Re-registering a location re-resolves and replaces the snapshot; the registrar''s preferences persist unless a new preference is supplied. An OBI carrying none of ob''s three format capabilities registers successfully but is inert for ob; registration warns.'
            operationId: registerDelegate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegisterDelegateInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegateSummary'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: 'Register a delegate — any referenceable OpenBindings interface (an exec: or http(s) location) that ob may route operations to.'
    /delegates/resolve-binding-spec:
        post:
            description: Report which delegate ob's routing would select for a format token, and the capabilities it offers for it — ob's format-narrowing diagnostic, layered on top of the operation-keyed resolveDelegate.
            operationId: resolveDelegateForBindingSpec
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ResolveDelegateForBindingSpecInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResolveDelegateForBindingSpecResult'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Report which delegate ob's routing would select for a format token, and the capabilities it offers for it — ob's format-narrowing diagnostic, layered on top of the operation-keyed resolveDelegate.
    /delegates/resolve/{operation}:
        get:
            description: 'Resolve an operation to the registered delegates that carry it — those whose interface answers to the operation''s key or an alias — ordered by effective preference: the per-operation override when set, else the delegate-level preference, else the baseline; ties favor the self-delegate, then registration order. Returns candidates only; it does not invoke anything, and ob''s routing applies its own narrowing (format support) on top.'
            operationId: resolveDelegate
            parameters:
                - in: path
                  name: operation
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ResolveDelegateResult'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: 'Resolve an operation to the registered delegates that carry it — those whose interface answers to the operation''s key or an alias — ordered by effective preference: the per-operation override when set, else the delegate-level preference, else the baseline; ties favor the self-delegate, then registration order.'
    /delegates/unregister:
        post:
            description: 'Remove a registered delegate by its location. Idempotent: unregistering a location that is not registered succeeds.'
            operationId: unregisterDelegate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DelegateLocationInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                type: "null"
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Remove a registered delegate by its location.
    /describe:
        get:
            description: 'Return identity and metadata about ob: name, version, description, homepage, repository, maintainer.'
            operationId: describe
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SoftwareIdentity'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: 'Return identity and metadata about ob: name, version, description, homepage, repository, maintainer.'
    /environment:
        get:
            description: 'Report a snapshot of the active OpenBindings environment (the .openbindings/ directory): whether it is local or global, its path, the number of delegates it holds, and the number of contexts in the user''s context store (contexts are user-scoped, not per-environment).'
            operationId: reportEnvironmentStatus
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EnvironmentStatus'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: 'Report a snapshot of the active OpenBindings environment (the .openbindings/ directory): whether it is local or global, its path, the number of delegates it holds, and the number of contexts in the user''s context store (contexts are user-scoped, not per-environment).'
    /environment/initialize:
        post:
            description: Initialize an OpenBindings environment (a local .openbindings/ directory, or the global one with global) and return the created environment's status.
            operationId: initializeEnvironment
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InitializeEnvironmentInput'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EnvironmentStatus'
                    description: Successful response.
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request is invalid or the operation cannot be applied.
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: A valid bearer or OAuth access token is required.
                "413":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body exceeds the server's delivery-unit limit.
                "415":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The request body is not JSON.
                default:
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                    description: The operation failed.
            summary: Initialize an OpenBindings environment (a local .openbindings/ directory, or the global one with global) and return the created environment's status.
    /healthz:
        get:
            operationId: healthCheck
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    status:
                                        const: ok
                                        type: string
                                required:
                                    - status
                                type: object
                    description: Successful response.
