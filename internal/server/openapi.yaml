openapi: "3.1.0"
info:
  title: ob serve API
  version: 0.1.0
  description: Local HTTP API for the OpenBindings CLI (ob serve).
servers:
  - url: ${OB_SERVER_URL}
    description: Default local server (port 20290 = 0x4F42, ASCII OB)

paths:
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check endpoint
      security: []
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /.well-known/openbindings:
    get:
      operationId: getOBI
      summary: Return the embedded OpenBindings Interface for ob itself
      security: []
      responses:
        "200":
          description: OpenBindings interface document
          content:
            application/json:
              schema:
                type: object

  /info:
    get:
      operationId: getInfo
      summary: Show ob identity and metadata
      responses:
        "200":
          description: Application info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInfo"

  /formats:
    get:
      operationId: listFormats
      summary: List format tokens this ob instance can handle
      responses:
        "200":
          description: Format list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /delegates:
    get:
      operationId: listDelegates
      summary: List delegates
      responses:
        "200":
          description: Delegate list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Delegate"

  /status:
    get:
      operationId: getEnvironmentStatus
      summary: Show environment status
      responses:
        "200":
          description: Environment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentStatus"

  /contexts:
    get:
      operationId: listContexts
      summary: List all contexts
      responses:
        "200":
          description: Context summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContextSummary"

  "/contexts/{url}":
    x-path-style: remainder
    get:
      operationId: getContext
      summary: Get the unified stored context for a target URL
      description: >
        Returns the unified context payload (credentials, headers, cookies,
        environment, metadata in a single opaque map) for the target URL, or
        null when no context exists. The {url} parameter captures the
        remainder of the path (including slashes); clients should append the
        target URL directly after /contexts/ without encoding slashes.
      parameters:
        - name: url
          in: path
          required: true
          schema:
            type: string
          description: Target URL (remainder path — slashes are literal, not encoded)
      responses:
        "200":
          description: Stored context payload, or null when no context exists
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Context"
                  - type: "null"
    put:
      operationId: setContext
      summary: Create or replace the stored context for a target URL
      description: >
        Full replacement. The request body is the unified context payload —
        credentials, headers, cookies, environment, and metadata fields in a
        single opaque map. Any existing context for the URL is replaced.
      parameters:
        - name: url
          in: path
          required: true
          schema:
            type: string
          description: Target URL (remainder path — slashes are literal, not encoded)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Context"
      responses:
        "200":
          description: Context updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  status:
                    type: string
    delete:
      operationId: deleteContext
      summary: Remove context for a target URL
      parameters:
        - name: url
          in: path
          required: true
          schema:
            type: string
          description: Target URL (remainder path — slashes are literal, not encoded)
      responses:
        "200":
          description: Context deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  status:
                    type: string

  /bindings/prepare:
    post:
      operationId: prepareBinding
      summary: Preflight a binding's context requirements
      description: >
        Side-effect-free preflight (the binding-invoker prepareBinding
        operation): reports the context a binding would require before
        invocation, or null when requirements cannot be determined statically.
        Advisory — invokeBinding's reactive CONTEXT_REQUIRED error (over the
        WebSocket frame stream described by asyncapi.yaml) is the
        authoritative source of requirements. When context is supplied, the
        result reports only the requirements still unsatisfied by it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, ref]
              properties:
                source:
                  $ref: "#/components/schemas/InvokeSource"
                ref:
                  type: string
                  description: Reference within the binding source (e.g., JSON Pointer for OpenAPI)
                context:
                  $ref: "#/components/schemas/BindingContext"
              additionalProperties: false
      responses:
        "200":
          description: Context requirements, or null when none are known statically
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ContextRequiredDetails"
                  - type: "null"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /interfaces/create:
    post:
      operationId: createInterface
      summary: Create an OpenBindings interface from binding sources
      description: >
        Creates an OpenBindings interface document, optionally from one or more
        binding source artifacts. This is the interface-creator host capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                openbindingsVersion:
                  type: string
                  description: Target OpenBindings spec version (e.g., "0.1.0")
                sources:
                  type: array
                  items:
                    $ref: "#/components/schemas/CreateInterfaceSource"
                name:
                  type: string
                  description: Interface name (overrides value derived from sources)
                version:
                  type: string
                  description: Interface contract version
                description:
                  type: string
                  description: Interface description
      responses:
        "200":
          description: Created OpenBindings interface document
          content:
            application/json:
              schema:
                type: object
                description: A valid OpenBindings interface document
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sources/inspect:
    post:
      operationId: inspectSource
      summary: Inspect a binding source artifact
      description: >
        Returns bindable targets discovered in a source artifact. This is the
        source-inspector host capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  $ref: "#/components/schemas/Source"
      responses:
        "200":
          description: Source inspection result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceInspection"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /resolve:
    post:
      operationId: resolveInterface
      summary: Resolve an interface from a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
      responses:
        "200":
          description: Resolved interface
          content:
            application/json:
              schema:
                type: object
                properties:
                  interface:
                    type: object
                  url:
                    type: string
                  finalUrl:
                    type: string
                  synthesized:
                    type: boolean

  /validate:
    post:
      operationId: validateInterface
      summary: Validate an OpenBindings interface document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [locator]
              properties:
                locator:
                  type: string
                strict:
                  type: boolean
      responses:
        "200":
          description: Validation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReport"

  /diff:
    post:
      operationId: compareInterfaces
      summary: Structural comparison of two OBIs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseline]
              properties:
                baseline:
                  type: string
                comparison:
                  type: string
                fromSources:
                  type: boolean
                onlySource:
                  type: string
      responses:
        "200":
          description: Diff report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffReport"

  /compatibility:
    post:
      operationId: assessCompatibility
      summary: Check interface conformance between two interfaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target, candidate]
              properties:
                target:
                  type: string
                candidate:
                  type: string
      responses:
        "200":
          description: Compatibility report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompatibilityReport"

  /spec/{name}:
    get:
      operationId: readSpecResource
      summary: Read an embedded spec documentation resource
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Spec resource content
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: Serve the OpenAPI specification for this server
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 specification
          content:
            text/yaml:
              schema:
                type: string


  /oauth/authorize:
    get:
      operationId: oauthAuthorize
      summary: OAuth2 authorization endpoint (PKCE required)
      description: >
        Initiates the OAuth2 Authorization Code flow with PKCE. Renders a consent
        page in the browser. The user approves or denies the request, and the server
        redirects back to the client's redirect_uri with an authorization code.
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            enum: [code]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
          description: Base64url-encoded SHA256 hash of the code_verifier
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum: [S256]
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: HTML consent page
          content:
            text/html:
              schema:
                type: string
    post:
      operationId: oauthApprove
      summary: OAuth2 consent form submission
      description: >
        Processes the user's approve/deny action from the consent page.
        On approval, redirects to the client's redirect_uri with an authorization code.
        On denial, redirects with an error.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [nonce, action]
              properties:
                nonce:
                  type: string
                  description: Authorization request nonce from the consent page
                action:
                  type: string
                  enum: [approve, deny]
      responses:
        "302":
          description: Redirect to client redirect_uri with code or error

  /oauth/token:
    post:
      operationId: oauthToken
      summary: OAuth2 token endpoint (exchanges code for access token)
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, code, code_verifier]
              properties:
                grant_type:
                  type: string
                  enum: [authorization_code]
                code:
                  type: string
                code_verifier:
                  type: string
                redirect_uri:
                  type: string
      responses:
        "200":
          description: Access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer

components:
  securitySchemes:
    oauth2Auth:
      type: oauth2
      description: >
        Browser OAuth2 (Authorization Code + PKCE, S256) against this server's
        own /oauth/authorize and /oauth/token endpoints. The resulting access
        token is presented as a bearer token on subsequent requests.
      flows:
        authorizationCode:
          authorizationUrl: ${OB_SERVER_URL}/oauth/authorize
          tokenUrl: ${OB_SERVER_URL}/oauth/token
          scopes: {}
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Static session token (printed on startup or set via --token/OB_SERVE_TOKEN)
        or an OAuth2 access token obtained via the /oauth/authorize + /oauth/token flow.

  schemas:
    AppInfo:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string

    EnvironmentStatus:
      type: object
      properties:
        environmentType:
          type: string
        environmentPath:
          type: string
        delegateCount:
          type: integer

    Context:
      type: object
      description: >
        Opaque per-target context payload — credentials, session state,
        headers, cookies, environment, metadata, or any other invoker-managed
        state. Well-known fields include bearerToken, apiKey, basic, headers,
        cookies, environment, metadata.
      additionalProperties: true

    ContextSummary:
      type: object
      properties:
        url:
          type: string
        hasCredentials:
          type: boolean
        headerCount:
          type: integer
        cookieCount:
          type: integer
        envCount:
          type: integer
        metadataCount:
          type: integer
        loadError:
          type: string

    Delegate:
      type: object
      properties:
        url:
          type: string
        formats:
          type: array
          items:
            type: string

    ValidationReport:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string

    DiffReport:
      type: object
      properties:
        identical:
          type: boolean
        operations:
          type: array
          items:
            type: object

    CompatibilityReport:
      type: object
      properties:
        compatible:
          type: boolean
        issues:
          type: array
          items:
            type: object

    BindingContext:
      type: object
      description: >-
        Opaque runtime context for binding invocation. Well-known credential
        fields: bearerToken, apiKey, basic, accessToken/refreshToken/expiresAt.
        Well-known transport fields: headers, cookies, environment, metadata.
      additionalProperties: true

    ContextRequirement:
      type: object
      description: >-
        One prerequisite that must be satisfied before a binding can be
        invoked, resolved into context. `type` names the requirement family
        (e.g. auth.bearer, auth.oauth2, auth.basic, auth.apiKey); the
        remaining fields are type-specific.
      properties:
        type:
          type: string
        description:
          type: string
        durable:
          type: boolean
          description: >-
            Whether resolved context MAY be cached under the challenge key and
            reused (true, the default) or MUST be satisfied freshly per
            invocation (false).
      required: [type]
      additionalProperties: true

    ContextRequiredDetails:
      type: object
      description: >-
        The details payload of a CONTEXT_REQUIRED invocation error and the
        return shape of prepareBinding. Alternatives are disjunctive (any one
        suffices); the requirements within one alternative are conjunctive
        (all must be satisfied).
      properties:
        target:
          type: string
          description: >-
            The target the binding addresses; the runtime derives a storage key
            from it.
        alternatives:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              requirements:
                type: array
                minItems: 1
                items:
                  $ref: "#/components/schemas/ContextRequirement"
            required: [requirements]
      required: [target, alternatives]

    InvokeSource:
      type: object
      required: [format]
      properties:
        format:
          type: string
          description: Format token (e.g., openapi@3.1, usage@2.13.1)
        location:
          type: string
          description: Location of the binding source (path or URL)
        content:
          description: Binding source content directly

    CreateInterfaceSource:
      type: object
      required: [format]
      properties:
        format:
          type: string
          description: Format token for this source
        location:
          type: string
          description: Location to fetch content from (path or URL)
        name:
          type: string
          description: Key name for this binding source in the output OBI's sources
        outputLocation:
          type: string
          description: Location to use in output instead of input path
        description:
          type: string
          description: Human-readable description for this binding source
        embed:
          type: boolean
          description: If true, embed content inline in the output OBI

    Source:
      type: object
      required: [format]
      properties:
        format:
          type: string
          description: Format token for this source
        location:
          type: string
          description: Location to fetch content from (path or URL)
        content:
          description: Content provided directly
        description:
          type: string
          description: Human-readable description for this source

    SourceInspection:
      type: object
      required: [targets, exhaustive]
      properties:
        targets:
          type: array
          items:
            $ref: "#/components/schemas/BindableTarget"
        exhaustive:
          type: boolean
          description: True when targets is the complete list of bindable targets for the source

    BindableTarget:
      type: object
      required: [ref]
      properties:
        ref:
          type: string
          description: Reference string to use in a binding entry
        operationKey:
          type: string
          description: Suggested operation key for this target
        operation:
          type: object
          description: Potential OpenBindings operation framing for this target
          additionalProperties: true

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
        detail:
          type: string
          description: Additional context about the error
        code:
          type: string
          description: Machine-readable error code

# Two disjunctive alternatives: authorize in the browser via OAuth2 (the
# preferred interactive flow) OR present a session/access token as a bearer.
# A client's invoker surfaces this as a CONTEXT_REQUIRED challenge with both
# alternatives; the oauth2 one carries the authorize/token endpoints.
security:
  - oauth2Auth: []
  - bearerAuth: []
