name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check if release exists
        id: check
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release ${{ github.ref_name }} already exists, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        if: steps.check.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - uses: actions/checkout@v7
        if: steps.check.outputs.skip != 'true'
        with:
          repository: openbindings/spec
          path: spec
      - uses: actions/setup-go@v7
        if: steps.check.outputs.skip != 'true'
        with:
          go-version-file: go.mod
      - name: Verify annotated SemVer tag
        if: steps.check.outputs.skip != 'true'
        run: |
          if ! printf '%s\n' "${{ github.ref_name }}" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::release tag must be exact SemVer in vX.Y.Z form"
            exit 1
          fi
          if [ "$(git cat-file -t "${{ github.ref_name }}")" != "tag" ]; then
            echo "::error::release tags must be annotated"
            exit 1
          fi
      - name: Verify tagged SDK dependencies resolve without the workspace
        if: steps.check.outputs.skip != 'true'
        run: go list -m all
        env:
          GOWORK: "off"
      - name: Build and vet
        if: steps.check.outputs.skip != 'true'
        run: |
          go build ./...
          go vet ./...
        env:
          GOWORK: "off"
      - name: Run race and conformance tests
        if: steps.check.outputs.skip != 'true'
        run: go test -race -short ./...
        env:
          GOWORK: "off"
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_CORPUS_REQUIRED: "1"
      - name: Run exec-lane and cross-surface conformance tests
        if: steps.check.outputs.skip != 'true'
        run: go test -race -run 'TestWireConformance_ExecLane|TestCrossSurfaceConformance|TestDemoSmoke_PrintedCommands' ./internal/cmd/
        env:
          GOWORK: "off"
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_CORPUS_REQUIRED: "1"
          OB_TEST_NO_CREDENTIAL_STORE: "1"
      - uses: goreleaser/goreleaser-action@v7
        if: steps.check.outputs.skip != 'true'
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Attest build provenance
        if: steps.check.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
