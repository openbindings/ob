name: OAS platform qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/oas-platform.yml'
      - 'scripts/verify-oas-platform.mjs'
      - 'go.mod'
      - 'go.sum'
      - 'internal/server/workbench/dist/**'

permissions:
  contents: read

jobs:
  normal-process:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      GOWORK: 'off'
      CGO_ENABLED: '0'
      OB_PLATFORM_BROWSER_ROOT: ${{ runner.temp }}/oas-platform-browser
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: ob
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: ob/go.mod
          cache: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install isolated browser harness
        run: npm install --prefix "$OB_PLATFORM_BROWSER_ROOT" --no-audit --no-fund playwright@1.61.1
      - name: Install browser
        run: node "$OB_PLATFORM_BROWSER_ROOT/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Prove normal installed-process invocation and browser journey
        run: node ob/scripts/verify-oas-platform.mjs "$GITHUB_WORKSPACE"
