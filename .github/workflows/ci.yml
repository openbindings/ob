name: CI

on:
  push:
    branches: [release/0.2]
  pull_request:
    branches: [release/0.2]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read the pinned Rust toolchain
        id: rust-version
        shell: bash
        run: |
          python - <<'PY'
          import os, tomllib
          with open('rust-toolchain.toml', 'rb') as source:
              version = tomllib.load(source)['toolchain']['channel']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.rust-version.outputs.version }}
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Exercise the release binary and verify publication remains disabled
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess, tomllib
          with open('Cargo.toml', 'rb') as source:
              manifest = tomllib.load(source)
          assert manifest['package']['publish'] is False, 'Preview publication must remain disabled'
          binary = pathlib.Path('target/release') / ('ob.exe' if os.name == 'nt' else 'ob')
          for args, expected in [(['--help'], 0), (['--version'], 0), (['show'], 2), (['init', 'absent.obi'], 3)]:
              result = subprocess.run([str(binary), *args], capture_output=True, text=True, timeout=10)
              assert result.returncode == expected, (args, result)
              if expected == 3:
                  assert not result.stdout and 'no operation ran' in result.stderr, result
          assert not pathlib.Path('absent.obi').exists(), 'Placeholder unexpectedly created a document'
          PY

  ci:
    if: always()
    needs: [native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every supported-host result to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(result != 'success' for result in results):
              raise SystemExit('Required job results: ' + repr(results))
          PY
