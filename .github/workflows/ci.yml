name: CI

on:
  push:
    branches: [main, "experiment/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ob
    steps:
      - uses: actions/checkout@v7
        with:
          path: ob
      # ob builds against SDK module versions that are not tagged yet; a
      # sibling checkout plus a CI-local go.work with version-less replaces
      # resolves them, exactly the way the local-dev go.work does. Release
      # builds (release.yml) see no go.work and resolve tagged versions.
      # Flip ref to main once the SDK's experiment line promotes.
      - uses: actions/checkout@v7
        with:
          repository: openbindings/openbindings-go
          ref: experiment/obi-first
          path: openbindings-go
      # The conformance corpora (transforms, binding-specs) are normative and
      # live in the spec repo; without this checkout the gates skip silently.
      - uses: actions/checkout@v7
        with:
          repository: openbindings/spec
          path: spec
      - uses: actions/setup-go@v7
        with:
          go-version-file: ob/go.mod
          cache: false
      - name: workspace (resolve untagged SDK modules from the sibling checkout)
        run: |
          go work init .
          awk '$1 ~ /^github.com\/openbindings\/openbindings-go/ {print $1}' go.mod | sort -u | while read -r mod; do
            rel="../openbindings-go${mod#github.com/openbindings/openbindings-go}"
            go work edit -replace "$mod=$rel"
          done
          go work edit -json
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -short ./...
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
      # The exec-lane suites are -short-gated because they build and exec the
      # real binary, so the line above skips them. Wire conformance is ob's
      # strongest oracle (every operation's output judged against its schema);
      # leaving it to dev machines meant CI could not see it fail. Named
      # explicitly rather than dropping -short, because the remaining gated
      # tests want live network and a keychain.
      - run: go test -race -run 'TestWireConformance_ExecLane|TestDemoSmoke_PrintedCommands' ./internal/cmd/
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          # The context cohort writes through the OS credential store, which a
          # headless runner has none of. Everything else in the lane runs.
          OB_TEST_NO_CREDENTIAL_STORE: "1"
