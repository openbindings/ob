name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ob
    steps:
      - uses: actions/checkout@v7
        with:
          path: ob
      # ob builds against SDK module versions that are not tagged yet; a
      # sibling checkout plus a CI-local go.work with version-less replaces
      # resolves them, exactly the way the local-dev go.work does. Release
      # builds (release.yml) see no go.work and resolve tagged versions.
      # Flip ref to main once the 0.2 release line promotes.
      - uses: actions/checkout@v7
        with:
          repository: openbindings/openbindings-go
          # Exact migration candidate; advance together with the consumer.
          ref: d253761245887b5e2dcdd67c21a18d048a86eeae
          path: openbindings-go
      - uses: actions/checkout@v7
        with:
          repository: openbindings/openapi-client
          ref: 7b15d57e960faa6a9e010eb9cbea80fd83f0d02e
          path: openapi-client
      - uses: actions/checkout@v7
        with:
          repository: openbindings/asyncapi-client
          ref: 7326ce4e18c12e1dcb36c3587fbe0f7fe52ec749
          path: asyncapi-client
      # The conformance corpora (transforms, binding-specs) are normative and
      # live in the spec repo; without this checkout the gates skip silently.
      - uses: actions/checkout@v7
        with:
          repository: openbindings/spec
          ref: be855315b01a75a8b5b5cfbf04852ff7bb9aad76
          path: spec
      # The Delegate Manager admission corpus is owned by the interfaces
      # repository. Pin the exact selected commit (never a moving branch or a
      # sibling-checkout fallback) so the gate certifies this corpus and no
      # other; the absence of the corpus is a hard failure below.
      - uses: actions/checkout@v7
        with:
          repository: openbindings/interfaces
          ref: fe526cc5c750a21f4dd61efaa758c35c6af91192
          path: interfaces
      - uses: actions/setup-go@v7
        with:
          go-version-file: ob/go.mod
          cache: false
      - name: workspace (resolve untagged SDK modules from the sibling checkout)
        run: |
          go work init .
          awk '$1 ~ /^github.com\/openbindings\/openbindings-go/ {print $1}' go.mod | sort -u | while read -r mod; do
            rel="../openbindings-go${mod#github.com/openbindings/openbindings-go}"
            go work edit -replace "$mod=$rel"
          done
          go work edit -replace "github.com/openbindings/openapi-client/go=../openapi-client/go"
          go work edit -replace "github.com/openbindings/asyncapi-client/go=../asyncapi-client/go"
          go work edit -json
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -short ./...
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_INTERFACES_CORPUS: ${{ github.workspace }}/interfaces/conformance
          OB_CORPUS_REQUIRED: "1"
      # The exec-lane suites are -short-gated because they build and exec the
      # real binary, so the line above skips them. Wire conformance judges each
      # CLI realization against its schema; cross-surface conformance also
      # proves that the CLI and ob-start bindings preserve the same operation
      # meaning. Named explicitly rather than dropping -short, because the
      # remaining gated tests want live network and a keychain.
      - run: go test -race -run 'TestWireConformance_ExecLane|TestCrossSurfaceConformance|TestDemoSmoke_PrintedCommands' ./internal/cmd/
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_CORPUS_REQUIRED: "1"
          # The context cohort writes through the OS credential store, which a
          # headless runner has none of. Everything else in the lane runs.
          OB_TEST_NO_CREDENTIAL_STORE: "1"
      # Delegate Manager gates: the mandatory manager, process-locking,
      # conversion/recovery and public-surface tests are selected by name
      # (outside -short, with race detection); the script refuses a missing
      # corpus, a zero-match selector, a skipped mandatory test or any failure.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/verify-delegate-manager.mjs --evidence "$RUNNER_TEMP/delegate-manager-gates.json"
        env:
          OB_SPEC_CORPUS: ${{ github.workspace }}/spec/conformance
          OB_INTERFACES_CORPUS: ${{ github.workspace }}/interfaces/conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delegate-manager-gates
          path: ${{ runner.temp }}/delegate-manager-gates.json
          if-no-files-found: warn
