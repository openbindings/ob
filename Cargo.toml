[package]
name = "openbindings-cli"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.99"
description = "The OpenBindings CLI command surface (operations not yet implemented)"
license = "Apache-2.0"
repository = "https://github.com/openbindings/ob"
publish = false

[[bin]]
name = "ob"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["string"] }
clap_complete = "4.6.11"

[dev-dependencies]
serde_json = "1.0"
